<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Versant 練習</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14151a; --sub:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd;
    --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5; --flashbg:rgba(0,0,0,.05);
    --ui:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  /* 寝る前用のダーク（純黒でなく目に優しい濃色） */
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e9ebf0; --sub:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f;
           --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20; --flashbg:rgba(255,255,255,.08); }
  }
  :root[data-theme="dark"]{ --ink:#e9ebf0; --sub:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f;
           --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20; --flashbg:rgba(255,255,255,.08); }
  :root[data-theme="light"]{ --ink:#14151a; --sub:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd;
           --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5; --flashbg:rgba(0,0,0,.05); }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:var(--ui);color:var(--ink);font-feature-settings:"palt" 1;-webkit-user-select:none;user-select:none}

  /* ===== ホーム ===== */
  #home{height:100dvh;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 46px) 24px calc(env(safe-area-inset-bottom) + 40px)}
  #home::-webkit-scrollbar{display:none}
  .brand{font-size:26px;font-weight:600;letter-spacing:-.02em}
  .tag{font-size:13px;color:var(--sub);margin:6px 0 28px}
  .plist{display:flex;flex-direction:column;gap:11px}
  .pcard{border:1px solid var(--line2);border-radius:16px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:14px}
  .pcard:active{background:var(--hover)}
  .pcard .id{font-size:13px;font-weight:600;color:var(--accent);width:20px}
  .pcard .nm{flex:1}
  .pcard .nm b{display:block;font-size:15px;font-weight:600}
  .pcard .nm span{font-size:12.5px;color:var(--sub)}
  .pcard .ct{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}

  /* ===== フィード ===== */
  #app{display:none;height:100dvh}
  #feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  #feed::-webkit-scrollbar{display:none}
  .card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 64px) 24px calc(env(safe-area-inset-bottom) + 20px)}
  .plabel{font-size:12.5px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
  .plabel b{color:var(--ink);font-weight:600}

  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0}
  .task{font-size:13px;color:var(--sub);font-weight:500;letter-spacing:.02em}
  .wave{display:flex;gap:5px;align-items:center;height:44px}
  .wave b{width:5px;height:12px;background:var(--line2);border-radius:3px;display:block}
  .wave.on b{background:var(--accent);animation:w .9s ease-in-out infinite}
  .wave.on b:nth-child(2){animation-delay:.1s}.wave.on b:nth-child(3){animation-delay:.2s}
  .wave.on b:nth-child(4){animation-delay:.3s}.wave.on b:nth-child(5){animation-delay:.15s}.wave.on b:nth-child(6){animation-delay:.25s}
  @keyframes w{0%,100%{height:11px}50%{height:38px}}

  .text{border-top:1px solid var(--line);padding-top:16px;min-height:118px;max-height:44dvh;overflow-y:auto}
  .text::-webkit-scrollbar{display:none}
  .veil{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:12.5px;padding:20px 0;cursor:pointer}
  .veil span{font-size:14px;color:var(--ink);font-weight:500}
  .en{font-size:20px;line-height:1.5;font-weight:500;letter-spacing:-.005em}
  .yaku{font-size:14px;color:var(--sub);margin-top:6px}
  .row{display:flex;gap:8px;margin-top:12px;font-size:14px;padding-top:12px;border-top:1px solid var(--line)}
  .row .k{color:var(--sub);white-space:nowrap;font-size:12px;padding-top:2px;min-width:3.6em}
  .row .v{color:var(--ink)}
  .row .v b{font-weight:600}
  .dlg div{font-size:14px;margin-bottom:3px}
  .dlg span{color:var(--sub);font-size:11.5px;margin-right:6px}
  .dlg .dy{color:var(--sub);font-size:12px;margin:0 0 8px 1.5em}

  .bot{margin-top:14px}
  .yt{display:flex;align-items:center;justify-content:center;gap:36px;margin-bottom:16px}
  .yb{border:0;background:none;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
  .yb:active{opacity:.5}
  .yb.seek{width:46px;height:46px}
  .yb.seek .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;padding-top:2px}
  .yb.play{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg)}
  .sub{display:flex;align-items:center;justify-content:center;gap:10px}
  .navb,.spd{border:1px solid var(--line2);background:none;color:var(--sub);font:inherit;font-size:13px;padding:9px 18px;border-radius:22px;cursor:pointer;white-space:nowrap}
  .spd{font-variant-numeric:tabular-nums;padding:9px 15px}

  .flash{position:fixed;top:42%;font-size:12.5px;color:var(--ink);font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none;z-index:6;background:var(--flashbg);padding:8px 13px;border-radius:20px}
  .flash.l{left:11%}.flash.r{right:11%}.flash.on{opacity:1}
  .hint{position:fixed;left:0;right:0;top:50%;text-align:center;font-size:12px;color:var(--sub);pointer-events:none;transition:.5s}
  .hint.hide{opacity:0}
  .hint .up{display:block;font-size:19px;margin-bottom:3px;animation:bob 1.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  .head{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .back{border:1px solid var(--line2);background:none;color:var(--sub);font:inherit;font-size:12.5px;padding:8px 14px;border-radius:24px;cursor:pointer}
  .htitle{font-size:12.5px;color:var(--ink);font-weight:600}
  /* 右上は設定ボタンだけ（基本は自動送り。切替は設定シートの中） */
  .gearb{border:1px solid var(--line2);background:none;color:var(--sub);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .gearb svg{width:17px;height:17px;display:block}

  /* ===== 設定シート ===== */
  .sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .sheetbg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:22px 24px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(101%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:21}
  .sheet.on{transform:translateY(0)}
  .sheet h3{font-size:15px;font-weight:600;margin-bottom:6px}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
  .setrow:first-of-type{border-top:0;margin-top:8px}
  .setrow .lb b{display:block;font-size:14px;font-weight:500}
  .setrow .lb span{font-size:12px;color:var(--sub)}
  .sw{width:46px;height:28px;border-radius:16px;border:1px solid var(--line2);background:var(--hover);position:relative;cursor:pointer;flex:none;transition:.2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);transition:.2s}
  .sw.on{background:var(--accent);border-color:var(--accent)}
  .sw.on::after{left:20px;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none}
  .seg button{border:0;background:none;color:var(--sub);font:inherit;font-size:12.5px;padding:7px 13px;cursor:pointer;border-left:1px solid var(--line2)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--accent);color:var(--bg)}
  .sheet .done{margin-top:22px;width:100%;border:1px solid var(--line2);background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:13px;border-radius:12px;cursor:pointer}

  /* ===== ホーム：はじめての案内・おすすめ・目安 ===== */
  .guide{border:1px solid var(--line2);border-radius:14px;padding:14px 16px;margin-bottom:22px;font-size:13px;line-height:1.75;color:var(--sub)}
  .guide b{color:var(--ink);font-weight:600}
  .guide .x{float:right;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;margin:0 -4px 0 8px}
  .pcard{position:relative}
  .pcard.rec{border-color:var(--accent)}
  /* おすすめ印は塗りバッジにせず、カード上辺の罫線を割るアクセント文字だけ */
  .rec-badge{position:absolute;top:-8px;left:16px;background:var(--bg);color:var(--accent);font-size:11px;font-weight:600;padding:0 7px;letter-spacing:.02em}
  .pcard .lv{font-size:11px;color:var(--faint);margin-top:3px}
</style>
</head>
<body>
<!-- ホーム -->
<div id="home">
  <div class="brand">Versant 練習</div>
  <div class="tag">本番と同じ例題を、耳で無限反復</div>
  <div class="guide" id="guide"><span class="x" id="guideX">×</span><b>はじめての方へ。</b>Versantは6つのパートに分かれた試験です。まずは <b>Part B「聞いて繰り返す」</b>から始めると、耳が慣れて楽に入れます。</div>
  <div class="plist" id="plist"></div>
</div>

<!-- フィード -->
<div id="app">
  <div class="head">
    <button class="back" id="back">ホーム</button>
    <div class="htitle" id="htitle"></div>
    <button class="gearb" id="mGear" aria-label="設定"></button>
  </div>
  <div id="feed"></div>
  <div class="hint" id="hint"><span class="up">↑</span>上にフリックで次の問題</div>
  <div class="flash l" id="flashL">− 10秒</div>
  <div class="flash r" id="flashR">＋ 10秒</div>
</div>

<!-- 設定シート（右上の歯車から開く。基本は自動送りON） -->
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet">
  <h3>設定</h3>
  <div class="setrow">
    <div class="lb"><b>自動送り</b><span>1問終わると次の問題へ自動で進む</span></div>
    <div class="sw on" id="swAuto" role="switch" aria-checked="true"></div>
  </div>
  <div class="setrow">
    <div class="lb"><b>表示モード</b><span>寝る前はダークが目に優しい</span></div>
    <div class="seg" id="segTheme">
      <button data-th="auto">自動</button><button data-th="light">ライト</button><button data-th="dark">ダーク</button>
    </div>
  </div>
  <button class="done" id="setDone">閉じる</button>
</div>
<audio id="au" preload="auto"></audio>

<script>
const AU=document.getElementById('au');
const TASK={A:'質問に短く答える',B:'聞いて繰り返す',C:'会話を聞いて答える',D:'話を聞いて答える',E:'自分の言葉で言い直す',F:'意見を述べる'};
let DATA=null,PART=null,CARDS=[],auto=true,active=0,revealed={},speed=1,lastTap=0;
const ARROW='<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/>';
const IC_RW='<svg viewBox="0 0 24 24" width="30" height="30">'+ARROW+'</svg><span class="num">10</span>';
const IC_FW='<svg viewBox="0 0 24 24" width="30" height="30"><g transform="translate(24,0) scale(-1,1)">'+ARROW+'</g></svg><span class="num">10</span>';
const IC_PLAY='<svg viewBox="0 0 24 24" width="30" height="30"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const IC_PAUSE='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>';
const IC_GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
document.getElementById('mGear').innerHTML=IC_GEAR;

// ===== テーマ（自動=端末に合わせる / ライト / ダーク・保存） =====
function applyTheme(){const s=localStorage.getItem('theme');
  if(s==='light'||s==='dark')document.documentElement.setAttribute('data-theme',s);
  else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('#segTheme button').forEach(b=>b.classList.toggle('on',b.dataset.th===(s||'auto')));}
applyTheme();
document.querySelectorAll('#segTheme button').forEach(b=>b.onclick=()=>{
  const th=b.dataset.th; if(th==='auto')localStorage.removeItem('theme'); else localStorage.setItem('theme',th); applyTheme();});

// ===== 設定シート開閉 =====
const SHEET=document.getElementById('sheet'),SHEETBG=document.getElementById('sheetbg');
function openSet(){SHEET.classList.add('on');SHEETBG.classList.add('on');}
function closeSet(){SHEET.classList.remove('on');SHEETBG.classList.remove('on');}
document.getElementById('mGear').onclick=openSet;
document.getElementById('setDone').onclick=closeSet;
SHEETBG.onclick=closeSet;

// ===== 自動送り（基本ON・保存） =====
const SW=document.getElementById('swAuto');
auto=localStorage.getItem('auto')!=='0';
SW.classList.toggle('on',auto);SW.setAttribute('aria-checked',auto);
SW.onclick=()=>{auto=!auto;SW.classList.toggle('on',auto);SW.setAttribute('aria-checked',auto);localStorage.setItem('auto',auto?'1':'0');};

// ===== ホームの「はじめての方へ」案内（×で閉じたら記憶） =====
(function(){const g=document.getElementById('guide');if(!g)return;
  if(localStorage.getItem('guideHidden'))g.style.display='none';
  document.getElementById('guideX').onclick=()=>{g.style.display='none';localStorage.setItem('guideHidden','1');};})();

boot();
function boot(){
  if(window.EMBED){ DATA=window.EMBED; renderHome(); }
  else fetch('player_data.json').then(r=>r.json()).then(d=>{DATA=d;renderHome();})
       .catch(()=>{document.getElementById('plist').innerHTML='<div class="tag">データが読めません</div>';});
}

const REC='B';                                                 // 初学者に最初に勧めるパート
const LV={A:'やさしい',B:'やさしい',C:'少し難しい',D:'少し難しい'};   // 入門者から見た目安
function renderHome(){
  document.getElementById('plist').innerHTML=DATA.parts.map((p,i)=>{
    const n=p.chapters.filter(c=>!c.tail).length;
    const rec=p.id===REC;
    return `<div class="pcard${rec?' rec':''}" data-p="${i}">`
      +(rec?'<span class="rec-badge">はじめはここ</span>':'')
      +`<div class="id">${p.id}</div>`
      +`<div class="nm"><b>${p.title}</b><span>${TASK[p.id]||''}</span><div class="lv">${LV[p.id]||''}</div></div>`
      +`<div class="ct">${n}問</div></div>`;
  }).join('');
  document.querySelectorAll('.pcard').forEach(el=>el.onclick=()=>openPart(+el.dataset.p));
}

function partAudio(p){ return p.audio ? p.audio : p.mp3; }  // 埋め込み時はdata URI

function openPart(pi){
  PART=DATA.parts[pi]; CARDS=PART.chapters.filter(c=>!c.tail); active=0; revealed={};
  document.getElementById('home').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('htitle').textContent=PART.title;
  AU.src=partAudio(PART); AU.playbackRate=speed;
  renderFeed();
  document.getElementById('feed').scrollTo({top:0});
  playCard(0);
  document.getElementById('hint').classList.remove('hide');
}
document.getElementById('back').onclick=()=>{AU.pause();document.getElementById('app').style.display='none';document.getElementById('home').style.display='block';};

function renderFeed(){
  const feed=document.getElementById('feed');
  feed.innerHTML=CARDS.map((c,i)=>`
    <section class="card" data-i="${i}">
      <div class="plabel"><b>${c.n}</b> / ${CARDS.length}</div>
      <div class="mid">
        <div class="task">${TASK[PART.id]||''}</div>
        <div class="wave" id="wave${i}"><b></b><b></b><b></b><b></b><b></b><b></b></div>
      </div>
      <div class="text" id="text${i}"><div class="veil" data-rev="${i}"><span>${PART.id==='B'?'英文を見る':'答えを見る'}</span>まず耳だけで挑戦</div></div>
      <div class="bot">
        <div class="yt">
          <button class="yb seek" data-seek="-10">${IC_RW}</button>
          <button class="yb play" data-play id="play${i}">${IC_PAUSE}</button>
          <button class="yb seek" data-seek="10">${IC_FW}</button>
        </div>
        <div class="sub">
          <button class="navb" data-nav="prev">前へ</button>
          <button class="spd" data-spd>${speed.toFixed(2).replace(/0$/,'')}x</button>
          <button class="navb" data-nav="next">次へ</button>
        </div>
      </div>
    </section>`).join('');

  feed.querySelectorAll('.card').forEach(card=>card.addEventListener('click',e=>{
    if(e.target.closest('.veil')){const i=+e.target.closest('.veil').dataset.rev;revealed[i]=true;paintText(i);return;}
    if(e.target.closest('[data-spd]')){const a=[1,0.85,0.7,1.15];speed=a[(a.indexOf(speed)+1)%a.length];AU.playbackRate=speed;document.querySelectorAll('[data-spd]').forEach(x=>x.textContent=speed+'x');return;}
    if(e.target.closest('[data-nav]')){goCard(e.target.closest('[data-nav]').dataset.nav==='next'?active+1:active-1);return;}
    if(e.target.closest('[data-seek]')){const s=+e.target.closest('[data-seek]').dataset.seek;seek(s,s<0?'l':'r');return;}
    if(e.target.closest('[data-play]')){AU.paused?AU.play():AU.pause();return;}
    const now=Date.now();
    if(now-lastTap<300){clearTimeout(window.__st);lastTap=0;const l=e.clientX<window.innerWidth/2;seek(l?-10:10,l?'l':'r');}
    else{lastTap=now;window.__st=setTimeout(()=>{AU.paused?AU.play():AU.pause();},300);}
  }));

  let tmr;
  feed.onscroll=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{
    const i=Math.round(feed.scrollTop/window.innerHeight);
    if(i!==active){active=i;document.getElementById('hint').classList.add('hide');playCard(i);}
  },90);};
}

function playCard(i){const c=CARDS[i];if(!c)return;AU.currentTime=c.start+0.02;AU.play().catch(()=>{});
  document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));document.getElementById('wave'+i)?.classList.add('on');
  revealed[i]=revealed[i]||false;paintText(i);}
function goCard(i){if(i<0||i>=CARDS.length)return;document.getElementById('feed').scrollTo({top:i*window.innerHeight,behavior:'smooth'});}
function seek(sec,side){const c=CARDS[active];if(!c)return;AU.currentTime=Math.max(c.start,Math.min(c.end-0.1,AU.currentTime+sec));if(AU.paused)AU.play();
  const f=document.getElementById(side==='l'?'flashL':'flashR');if(f){f.classList.add('on');clearTimeout(f.__t);f.__t=setTimeout(()=>f.classList.remove('on'),450);}}

AU.addEventListener('timeupdate',()=>{const c=CARDS[active];if(!c)return;
  if(AU.currentTime>=c.end-0.05){if(auto&&active<CARDS.length-1)goCard(active+1);else AU.pause();}});
AU.addEventListener('play',()=>{document.getElementById('wave'+active)?.classList.add('on');const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PAUSE;document.getElementById('hint')?.classList.add('hide');});
AU.addEventListener('pause',()=>{document.getElementById('wave'+active)?.classList.remove('on');const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PLAY;});

function paintText(i){const c=CARDS[i],el=document.getElementById('text'+i);if(!el)return;
  if(!revealed[i]){el.innerHTML=`<div class="veil" data-rev="${i}"><span>${PART.id==='B'?'英文を見る':'答えを見る'}</span>まず耳だけで挑戦</div>`;return;}
  document.getElementById('hint')?.classList.add('hide');
  let h='';
  if(c.dialogue&&c.dialogue.length){h+='<div class="dlg">'+c.dialogue.map(d=>`<div><span>${d.speaker}</span>${d.text}</div>`+(d.yaku?`<div class="dy">${d.yaku}</div>`:'')).join('')+'</div>';}
  else if(c.en){h+=`<div class="en">${c.en}</div>`; if(c.yaku)h+=`<div class="yaku">${c.yaku}</div>`;}
  if(c.bone&&c.bone.length)h+=`<div class="row"><span class="k">要点</span><span class="v">${c.bone.join(' / ')}</span></div>`;
  if(c.answer&&PART.id!=='B')h+=`<div class="row"><span class="k">答え</span><span class="v"><b>${c.answer}</b>${c.a_yaku?'　'+c.a_yaku:''}</span></div>`;
  if(c.target)h+=`<div class="row"><span class="k">聞き比べ</span><span class="v"><b>${c.target}</b> → ${c.target_kana||''}${c.memo?'　'+c.memo:''}</span></div>`;
  else if(c.memo)h+=`<div class="row"><span class="k">手がかり</span><span class="v">${c.memo}</span></div>`;
  el.innerHTML=h;
}


if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('nexttrack',()=>goCard(active+1));
  navigator.mediaSession.setActionHandler('previoustrack',()=>goCard(active-1));
  navigator.mediaSession.setActionHandler('seekbackward',()=>seek(-10,'l'));
  navigator.mediaSession.setActionHandler('seekforward',()=>seek(10,'r'));
}
</script>
