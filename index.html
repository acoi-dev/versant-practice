<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Versant 練習</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14151a; --sub:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd;
    --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5; --flashbg:rgba(0,0,0,.05);
    --ui:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  /* 寝る前用のダーク（純黒でなく目に優しい濃色） */
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e9ebf0; --sub:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f;
           --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20; --flashbg:rgba(255,255,255,.08); }
  }
  :root[data-theme="dark"]{ --ink:#e9ebf0; --sub:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f;
           --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20; --flashbg:rgba(255,255,255,.08); }
  :root[data-theme="light"]{ --ink:#14151a; --sub:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd;
           --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5; --flashbg:rgba(0,0,0,.05); }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:var(--ui);color:var(--ink);font-feature-settings:"palt" 1;-webkit-user-select:none;user-select:none;touch-action:manipulation}

  /* ===== ホーム ===== */
  /* ホームはプレイヤーの上にかぶさるオーバーレイ（画面遷移でなくその場で開閉） */
  #home{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 46px) 24px calc(env(safe-area-inset-bottom) + 84px);transition:opacity .18s ease,transform .18s ease}
  #home.off{opacity:0;transform:scale(.99);pointer-events:none}
  #home::-webkit-scrollbar{display:none}
  /* 右上の閉じる×（ホーム・設定 共通） */
  .closex{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:12;border:1px solid var(--line2);background:var(--bg);color:var(--sub);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:24px;line-height:1}
  .closex[hidden]{display:none}
  .pop .closex{position:absolute;top:10px;right:12px}
  /* パートを閉じる×は右下（親指位置）。設定の×は上のまま */
  #homeClose{top:auto;bottom:calc(env(safe-area-inset-bottom) + 16px);right:16px}
  .brand{font-size:26px;font-weight:600;letter-spacing:-.02em}
  .tag{font-size:13px;color:var(--sub);margin:6px 0 28px}
  .plist{display:flex;flex-direction:column;gap:11px}
  .disc{font-size:11px;color:var(--faint);line-height:1.75;margin-top:28px;text-align:center;padding:0 4px}  /* 非公式の免責 */
  .disc .r{font-size:8px;vertical-align:super}
  .build{font-size:10px;color:var(--faint);text-align:center;margin-top:12px;letter-spacing:.04em}  /* キャッシュ判別用のbuild番号 */
  .pcard{border:1px solid var(--line2);border-radius:16px;padding:15px 20px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .pcard:active{background:var(--hover)}
  .pcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .pcard .eb{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);font-weight:600}
  .pcard .meta{font-size:11.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pcard .ttl{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .pcard .desc{font-size:12.5px;color:var(--sub)}

  /* ===== フィード ===== */
  #app{position:fixed;inset:0;transition:opacity .22s ease,transform .22s ease}
  #app.off{opacity:0;transform:translateY(10px);pointer-events:none}
  #feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  #feed::-webkit-scrollbar{display:none}
  .card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 60px) 24px calc(env(safe-area-inset-bottom) + 88px)}
  /* パート末の番兵カード＝スワイプ/タップで次パートへ */
  .nextcard,.prevcard{justify-content:center;align-items:center;text-align:center}
  .nextwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
  .nextlabel{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
  .nextbtn{font:inherit;font-size:16px;font-weight:600;color:var(--accent);background:none;
    border:1px solid var(--line2);border-radius:14px;padding:16px 30px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px}
  .nextbtn small{font-size:12px;color:var(--sub);font-weight:400;letter-spacing:.01em}
  .plabel{font-size:12.5px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
  .plabel b{color:var(--ink);font-weight:600}

  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0}
  .task{font-size:13px;color:var(--sub);font-weight:500;letter-spacing:.02em}
  .wave{display:flex;gap:5px;align-items:center;height:44px}
  .wave b{width:5px;height:12px;background:var(--line2);border-radius:3px;display:block}
  .wave.on b{background:var(--accent);animation:w .9s ease-in-out infinite}
  .wave.on b:nth-child(2){animation-delay:.1s}.wave.on b:nth-child(3){animation-delay:.2s}
  .wave.on b:nth-child(4){animation-delay:.3s}.wave.on b:nth-child(5){animation-delay:.15s}.wave.on b:nth-child(6){animation-delay:.25s}
  @keyframes w{0%,100%{height:11px}50%{height:38px}}

  .text{padding-top:16px;min-height:118px;max-height:48dvh;overflow-y:auto}  /* containを外し、答え欄の端まで来たらカード送りに繋がるように(答え表示中もスワイプで次へ) */
  .text::-webkit-scrollbar{display:none}
  .veil{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--sub);padding:22px 0;cursor:pointer}
  .veil svg{width:27px;height:27px;display:block;color:var(--sub)}
  .veil span{font-size:12.5px;color:var(--sub)}
  /* 答えを再度隠すボタン（表示中の先頭） */
  .hidebtn{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;cursor:pointer;padding-bottom:11px;margin-bottom:3px;border-bottom:1px solid var(--line)}
  .hidebtn svg{width:15px;height:15px}
  /* 会話を全部見る（Part C・畳んでおく） */
  .dlgtoggle{color:var(--accent);font-size:13px;cursor:pointer;padding:11px 0 2px}
  .kana{font-size:13px;color:var(--sub);margin-bottom:5px;letter-spacing:.02em;line-height:1.6}  /* 英文の上・どう聞こえるか。かたまりで区切る */
  .kana b{color:var(--ink);font-weight:700}  /* 強く・高く読むかたまり=抑揚 */
  .en{font-size:20px;line-height:1.5;font-weight:500;letter-spacing:-.005em}
  .yaku{font-size:14px;color:var(--sub);margin-top:6px}
  .tip{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.65}  /* 解説の一言 */
  .pass{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}  /* Part D 本文全文 */
  .pass .pk{font-size:12px;color:var(--sub);margin-bottom:7px}
  .pass .pk span{margin-left:8px;color:var(--faint);font-size:11px}
  .pass .pen{font-size:15px;line-height:1.75;color:var(--ink)}
  .pass .pen b{font-weight:700}          /* 答えの手がかりの一文は太字で強調(色は付けず濃淡で) */
  .pass .pyaku{font-size:13px;line-height:1.75;color:var(--sub);margin-top:8px}
  .pass .pyaku b{font-weight:700;color:var(--ink)}
  .row{display:flex;gap:8px;margin-top:15px;font-size:14px}
  .row .k{color:var(--sub);white-space:nowrap;font-size:12px;padding-top:2px;min-width:3.6em}
  .row .v{color:var(--ink)}
  .row .v b{font-weight:600}
  .dlg div{font-size:14px;margin-bottom:3px}
  .dlg span{color:var(--sub);font-size:11.5px;margin-right:6px}
  .dlg .dy{color:var(--sub);font-size:12px;margin:0 0 8px 1.5em}
  /* 「文字を大きく」ON時 */
  body.bigtext .en{font-size:23px}
  body.bigtext .yaku{font-size:16px}
  body.bigtext .row{font-size:15.5px}
  body.bigtext .dlg div{font-size:16px}
  body.bigtext .dlg .dy{font-size:14px}

  .bot{margin-top:14px}
  /* 再生/停止を画面中央に固定、もう一回と速度を左右に置く */
  .yt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:6px}
  .yb{border:0;background:none;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
  .yb:active{opacity:.5}
  .yb.rep{width:46px;height:46px;justify-self:center}
  .yb.play{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);justify-self:center}
  .spd{border:1px solid var(--line2);background:none;color:var(--sub);font:inherit;font-size:13px;padding:9px 15px;border-radius:22px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;justify-self:center}

  .hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 104px);text-align:center;font-size:12px;color:var(--sub);pointer-events:none;transition:.5s}
  .hint.hide{opacity:0}
  .hint .up{display:block;font-size:19px;margin-bottom:3px;animation:bob 1.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* 上部：タイトル中央＋設定は右上（あまり使わないので親指圏外でOK） */
  .head{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;padding:0 64px;display:flex;justify-content:center;align-items:center;z-index:5}
  .htitle{text-align:center;font-size:13px;color:var(--ink);font-weight:600}
  .topgear{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:16px;z-index:9;border:1px solid var(--line2);background:none;color:var(--sub);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .topgear svg{width:22px;height:22px;display:block}

  /* ===== 下部の片手操作バー（ホーム／答え表示／設定） ===== */
  /* 3カラムgridで中央ボタンを画面ど真ん中に固定（幅差でずれない） */
  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:10px 20px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg)}
  .navb{border:1px solid var(--line2);background:none;color:var(--sub);cursor:pointer;font:inherit;
    display:flex;align-items:center;justify-content:center;gap:7px}
  .navb:active{background:var(--hover)}
  /* よく使う「答えを見る/隠す」は中央、ホームは右下 */
  .navb.eye{grid-column:2;justify-self:center;font-size:14px;color:var(--ink);padding:12px 20px;border-radius:26px}
  .navb svg{width:20px;height:20px;display:block}
  .navb.eye[hidden]{display:none}
  .navb.home{grid-column:3;justify-self:end;width:46px;height:46px;padding:0;border-radius:50%}

  /* ===== 設定シート ===== */
  /* ===== 設定ポップオーバー（歯車の直下にその場で・画面遷移なし） ===== */
  .popbg{position:fixed;inset:0;z-index:20;display:none}
  .popbg.on{display:block}
  .pop{position:fixed;top:calc(env(safe-area-inset-top) + 56px);right:16px;width:min(288px,86vw);
    background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:4px 16px 12px;z-index:21;
    max-height:calc(100dvh - 100px);overflow-y:auto;
    opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity .13s ease,transform .13s ease;pointer-events:none}
  .pop::-webkit-scrollbar{display:none}
  .pop.on{opacity:1;transform:none;pointer-events:auto}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .setrow:first-of-type{border-top:0;margin-top:30px}
  .setrow.col{flex-direction:column;align-items:stretch;gap:9px}
  .setrow .lb b{display:block;font-size:13.5px;font-weight:500}
  .setrow .lb span{font-size:11.5px;color:var(--sub)}
  .sw{width:44px;height:26px;border-radius:15px;border:1px solid var(--line2);background:var(--hover);position:relative;cursor:pointer;flex:none;transition:.2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);transition:.2s}
  .sw.on{background:var(--accent);border-color:var(--accent)}
  .sw.on::after{left:19px;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12.5px;padding:8px 0;cursor:pointer;border-left:1px solid var(--line2)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--accent);color:var(--bg)}
  .pophint{font-size:11px;color:var(--faint);line-height:1.6;padding-top:12px;border-top:1px solid var(--line)}

  /* ===== ホーム：目安 ===== */
  .pcard{position:relative}
  .pcard.current{border-color:var(--accent)}   /* 今いるパートだけ枠線(選択中の意味) */
</style>
</head>
<body>
<!-- ホーム -->
<div id="home">
  <button class="closex" id="homeClose" aria-label="閉じる" hidden>&times;</button>
  <div class="brand">Versant 練習</div>
  <div class="tag">本番と同じ例題を、耳で無限反復</div>
  <div class="plist" id="plist"></div>
  <p class="disc">非公式の練習アプリです。Versant<span class="r">®</span> は Pearson Education 社の商標で、本アプリは Pearson 社および Versant と関係ありません。掲載の例題はすべてオリジナルで、本番の試験問題ではありません。</p>
  <div id="build" class="build"></div>
</div>

<!-- フィード -->
<div id="app" class="off">
  <div class="head">
    <div class="htitle" id="htitle"></div>
  </div>
  <button class="topgear" id="mGear" aria-label="設定"></button>
  <div id="feed"></div>
  <div class="hint" id="hint"><span class="up">↑</span>上にフリックで次の問題</div>
  <!-- 片手操作バー（よく使う「答えを見る/隠す」は中央、ホームは右下） -->
  <div class="navbar">
    <button class="navb eye" id="eyeToggle"></button>
    <button class="navb home" id="back" aria-label="パート一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
  </div>
</div>

<!-- 設定ポップ（右上の歯車の直下にその場で開く。画面遷移なし） -->
<div class="popbg" id="popbg"></div>
<div class="pop" id="pop">
  <button class="closex" id="popClose" aria-label="閉じる">&times;</button>
  <div class="setrow">
    <div class="lb"><b>自動送り</b><span>終わると次へ自動で進む</span></div>
    <div class="sw on" id="swAuto" role="switch" aria-checked="true"></div>
  </div>
  <div class="setrow">
    <div class="lb"><b>1問リピート</b><span>次に進まず同じ文を繰り返す</span></div>
    <div class="sw" id="swRepeat" role="switch" aria-checked="false"></div>
  </div>
  <div class="setrow">
    <div class="lb"><b>答えを隠す</b><span>最初は耳だけで挑戦する</span></div>
    <div class="sw on" id="swHide" role="switch" aria-checked="true"></div>
  </div>
  <div class="setrow col">
    <div class="lb"><b>標準の速さ</b></div>
    <div class="seg" id="segSpeed">
      <button data-sp="1">1.0x</button><button data-sp="0.85">0.85x</button><button data-sp="0.7">0.7x</button>
    </div>
  </div>
  <div class="setrow">
    <div class="lb"><b>文字を大きく</b><span>英文・訳・解説を大きく表示</span></div>
    <div class="sw" id="swBig" role="switch" aria-checked="false"></div>
  </div>
  <div class="setrow col">
    <div class="lb"><b>表示モード</b></div>
    <div class="seg" id="segTheme">
      <button data-th="auto">自動</button><button data-th="light">ライト</button><button data-th="dark">ダーク</button>
    </div>
  </div>
  <div class="setrow">
    <div class="lb"><b>画面をスリープさせない</b><span>学習中は画面を消さない</span></div>
    <div class="sw" id="swWake" role="switch" aria-checked="false"></div>
  </div>
</div>
<audio id="au" preload="auto"></audio>

<script>
const AU=document.getElementById('au');
const TASK={A:'質問に短く答える',B:'聞いて繰り返す',C:'会話を聞いて答える',D:'話を聞いて答える',E:'自分の言葉で言い直す',F:'意見を述べる'};
let DATA=null,PART=null,CARDS=[],auto=true,active=0,revealed={},speed=1,hideAns=true,dlgShown={},partIdx=null;
const SPEEDS=[1,0.85,0.7];                                   // 速度は3段(設定パネルと同じ)。カードのタップもこの順で回す
const spdTxt=s=>s.toFixed(2).replace(/0$/,'')+'x';          // 速度表示を統一(1.0x/0.85x/0.7x)。初期もタップも設定も同じ表記に
const ARROW='<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/>';
const IC_REPLAY='<svg viewBox="0 0 24 24" width="26" height="26">'+ARROW+'</svg>';
const IC_EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_EYEOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20C5 20 2 12 2 12a18.5 18.5 0 0 1 5.1-6M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
const IC_PLAY='<svg viewBox="0 0 24 24" width="30" height="30"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const IC_PAUSE='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>';

function applyTheme(){const s=localStorage.getItem('theme');
  if(s==='light'||s==='dark')document.documentElement.setAttribute('data-theme',s);
  else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('#segTheme button').forEach(b=>b.classList.toggle('on',b.dataset.th===(s||'auto')));}

  const th=b.dataset.th; if(th==='auto')localStorage.removeItem('theme'); else localStorage.setItem('theme',th); applyTheme();});

let wakeOn=localStorage.getItem('wake')==='1',wakeLock=null;
const SWW=document.getElementById('swWake');
SWW.classList.toggle('on',wakeOn);SWW.setAttribute('aria-checked',wakeOn);
async function reqWake(){if(wakeOn&&'wakeLock'in navigator&&document.visibilityState==='visible'){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}}
function relWake(){try{if(wakeLock)wakeLock.release();}catch(e){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wakeOn)reqWake();});
SWW.onclick=()=>{wakeOn=!wakeOn;SWW.classList.toggle('on',wakeOn);SWW.setAttribute('aria-checked',wakeOn);localStorage.setItem('wake',wakeOn?'1':'0');wakeOn?reqWake():relWake();};

boot();
function boot(){
  if(window.EMBED){ DATA=window.EMBED; renderHome(); restoreState(); }
  else fetch('player_data.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;renderHome();restoreState();})
       .catch(()=>{document.getElementById('plist').innerHTML='<div class="tag">データが読めません</div>';});
}
// ===== リロードしても今の画面(どのパート・どのカード・一覧を開いていたか)を保つ =====
function saveState(){try{localStorage.setItem('st',JSON.stringify({p:partIdx,c:active,h:!document.getElementById('home').classList.contains('off')}));}catch(e){}}
function restoreState(){let st;try{st=JSON.parse(localStorage.getItem('st'));}catch(e){}
  if(st&&st.p!=null&&DATA.parts&&DATA.parts[st.p]){
    openPart(st.p, st.c||0, true);   // 復元時は自動再生しない(iOSは無操作で鳴らせない→▶表示・1タップで頭出し位置から再生)
    if(st.h){document.getElementById('home').classList.remove('off');markCurrent();}   // 一覧を開いた状態だったら開いたまま戻す
  }}

const LV={A:'やさしい',B:'やさしい',C:'少し難しい',D:'少し難しい',E:'難しい'};   // 入門者から見た目安
// 崩れの種類ごとの平易な解説(音声学の専門用語は出さない)
const TIP={form:'2語がくっついて短く言われます。かたまりで覚えると聞き取れます。',
  yod:'前の語と you などが溶け合って「デュ／ヂュ」のように聞こえます。',
  flap:'t や d が軽い「ら行」のように濁って聞こえます。',
  link:'語尾と次の語の頭がつながって、ひとつの音に聞こえます。',
  drop_t:'t の音がほとんど消えて聞こえます。',
  drop_h:'h の音が消えて前の語とくっつきます。'};
function renderHome(){
  document.getElementById('plist').innerHTML=DATA.parts.map((p,i)=>{
    const n=p.chapters.filter(c=>!c.tail).length;
    const name=p.title.replace(/^Part\s+\S+\s+/,'');   // "Part A 質問" → "質問"(先頭のPart Xは小見出しへ)
    return `<div class="pcard" data-p="${i}">`
      +`<div class="top"><span class="eb">Part ${p.id}</span><span class="meta">${LV[p.id]||''} ・ ${n}問</span></div>`
      +`<div class="ttl">${name}</div>`
      +`<div class="desc">${TASK[p.id]||''}</div></div>`;
  }).join('');
  document.querySelectorAll('.pcard').forEach(el=>el.onclick=()=>openPart(+el.dataset.p));
}

function partAudio(p){ return p.audio ? p.audio : p.mp3; }  // 埋め込み時はdata URI

let switching=false, switchTarget=0;   // パート切替中は判定停止。目標カード(switchTarget)に着地するまで前/次パート発火を抑止(scrollTop=0の一瞬で番兵を拾う誤発火を防ぐ)
let lastSwipe=0;       // 直近にユーザーがスワイプして表示カードを変えた時刻。この直後は表示を正=音声を合わせる
function openPart(pi, startCard, noPlay){   // noPlay=リロード復元時。iOSは無操作で自動再生できないので鳴らさず頭出しだけ
  startCard = startCard || 0;
  switching=true;   // 目標カードに着地するまで判定停止(switchTargetは下でclamp後に設定)
  PART=DATA.parts[pi]; partIdx=pi; CARDS=PART.chapters.filter(c=>!c.tail);
  startCard=Math.min(Math.max(0,startCard|0), Math.max(0,CARDS.length-1));   // 教材再生成でカードが減った時など、保存indexが範囲外でも安全に(Bug7)
  active=startCard; switchTarget=startCard; revealed={}; dlgShown={};
  document.getElementById('homeClose').hidden=false;   // 一度パートを開いたら、以後一覧は×で閉じてプレイヤーに戻れる
  document.getElementById('htitle').textContent=PART.title;
  ensureAudioSource(); AU.playbackRate=speed;   // ★前パートの音源が残らないよう必ずロードし直す(パート間の音ズレ根治)
  renderFeed();
  document.getElementById('home').classList.add('off');
  document.getElementById('app').classList.remove('off');
  const _feed=document.getElementById('feed');
  // 先頭に「前パート」番兵があるので実カードは表示index+1。目的カードへ移動(mandatory snapは一時解除)
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    _feed.style.scrollSnapType='none';
    const t=_feed.querySelector('.card[data-i="'+startCard+'"]'); if(t)_feed.scrollTop=t.offsetTop;   // 高さ計算でなく対象カードのoffsetTopへ
    requestAnimationFrame(()=>{ _feed.style.scrollSnapType=''; });   // switchingはonscrollが目標カード着地で解除(番兵誤発火防止)
  }));
  setTimeout(()=>{ switching=false; }, 800);   // 保険: 着地イベントが来なくても必ず解除
  playCard(startCard, noPlay);
  document.getElementById('hint').classList.remove('hide');
  saveState();
}
// ホームに戻っても音声は止めない(設定と同じく同ページ内の移動として扱う)
// ホームはプレイヤーの上にかぶせて開く(画面遷移でなく)。プレイヤーはそのまま裏で継続
function markCurrent(){document.querySelectorAll('.pcard').forEach(el=>el.classList.toggle('current',+el.dataset.p===partIdx));}  // 今いるパートに枠線
document.getElementById('back').onclick=()=>{closeSet();markCurrent();document.getElementById('home').classList.remove('off');saveState();};
// ×で閉じると、さっきのプレイヤーに位置そのまま・音も止めずに戻る
document.getElementById('homeClose').onclick=()=>{document.getElementById('home').classList.add('off');saveState();};

// 答え表示トグル（下バー中央・親指位置）。今のカードの表示/非表示を切り替える
function updateEye(){const b=document.getElementById('eyeToggle');if(!b)return;
  if(!hideAns){b.hidden=true;return;} b.hidden=false;
  const shown=revealed[active];
  b.innerHTML=(shown?IC_EYEOFF:IC_EYE)+'<span>'+(shown?'隠す':'見る')+'</span>';}
document.getElementById('eyeToggle').onclick=()=>{revealed[active]=!revealed[active];paintText(active);updateEye();};
document.getElementById('popClose').onclick=closeSet;

function renderFeed(){
  const feed=document.getElementById('feed');
  const pp=(partIdx-1+DATA.parts.length)%DATA.parts.length;   // 前パート(先頭なら末尾へ回る)
  const np=(partIdx+1)<DATA.parts.length?partIdx+1:0;         // 次パート
  feed.innerHTML=`
    <section class="card prevcard" data-i="-1">
      <div class="nextwrap">
        <button class="nextbtn" data-prev>前のパートへ<small>${DATA.parts[pp].title}</small></button>
      </div>
    </section>`
    + CARDS.map((c,i)=>`
    <section class="card" data-i="${i}">
      <div class="plabel"><b>${c.n}</b> / ${CARDS.length}</div>
      <div class="mid">
        <div class="task">${TASK[PART.id]||''}</div>
        <div class="wave" id="wave${i}"><b></b><b></b><b></b><b></b><b></b><b></b></div>
      </div>
      <div class="text" id="text${i}"></div>
      <div class="bot">
        <div class="yt">
          <button class="yb rep" data-rep aria-label="もう一回">${IC_REPLAY}</button>
          <button class="yb play" data-play id="play${i}">${IC_PAUSE}</button>
          <button class="spd" data-spd>${spdTxt(speed)}</button>
        </div>
      </div>
    </section>`).join('')
    + `
    <section class="card nextcard" data-i="${CARDS.length}">
      <div class="nextwrap">
        <div class="nextlabel">${PART.title} おわり</div>
        <button class="nextbtn" data-next>次のパートへ<small>${DATA.parts[np].title}</small></button>
      </div>
    </section>`;

  feed.querySelectorAll('.card').forEach(card=>card.addEventListener('click',e=>{
    if(e.target.closest('.prevcard')){goPrevPart();return;}   // 先頭番兵=前パートへ
    if(e.target.closest('.nextcard')){goNextPart();return;}   // 末尾番兵=次パートへ
    if(e.target.closest('.veil')){const i=+e.target.closest('.veil').dataset.rev;revealed[i]=true;paintText(i);return;}
    if(e.target.closest('[data-hide]')){const i=+e.target.closest('[data-hide]').dataset.hide;revealed[i]=false;paintText(i);return;}
    if(e.target.closest('[data-dlg]')){const i=+e.target.closest('[data-dlg]').dataset.dlg;dlgShown[i]=true;paintText(i);return;}
    if(e.target.closest('[data-spd]')){speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];AU.playbackRate=speed;document.querySelectorAll('[data-spd]').forEach(x=>x.textContent=spdTxt(speed));if(typeof syncSpeedSeg==='function')syncSpeedSeg();return;}
    if(e.target.closest('[data-rep]')){replay();return;}
    if(e.target.closest('[data-play]')){togglePlay();return;}
    togglePlay();   // カードのどこをタップしても再生/停止(ダブルタップ廃止=拡大防止)
  }));

  // 今どのカードかは、高さ計算(innerHeight≠100dvhでズレる)でなく「スクロール位置に一番近いカード」で決める
  let tmr;
  feed.onscroll=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{
    const st=feed.scrollTop; let best=null,bd=1e9;
    feed.querySelectorAll('.card').forEach(el=>{const d=Math.abs(el.offsetTop-st);if(d<bd){bd=d;best=el;}});
    if(!best)return;
    const ri=best.classList.contains('prevcard')?-1:(best.classList.contains('nextcard')?CARDS.length:(+best.dataset.i));
    if(switching){ if(ri===switchTarget)switching=false; return; }   // 切替の自動スクロール中は、目標カードに着地するまで一切判定しない(scrollTop=0の一瞬で番兵を拾う誤発火を防ぐ)
    if(ri<0){goPrevPart();return;}                              // 先頭番兵=前パートへ
    if(ri>=CARDS.length){goNextPart();return;}                  // 末尾番兵=次パートへ
    if(ri!==active){active=ri;lastSwipe=Date.now();document.getElementById('hint')?.classList.add('hide');playCard(ri);saveState();}   // ユーザーが手で送った=この後1.2秒は表示を正とする
  },90);};

  CARDS.forEach((_,i)=>paintText(i));   // 全カードを最初から正しい状態に(隠す=空/常時表示=本文)。スワイプ中のveilチラつき防止
}

let seekSeq=0, srcPartId=null;
// ===== 音源の取り違え防止(重要) =====
// iOSは <audio> の .src を差し替えても .load() しないと前パートの音源が残ることがある。
// すると表示はEなのに AU にはCの音源が載ったまま→trySeekがCをEのタイムにシークし、
// 「Part Eを表示しながらPart Cの会話が鳴る」パート間ズレになる。ここで必ず今のPARTの音源を載せる。
function ensureAudioSource(){
  if(!PART) return false;
  const nsrc=partAudio(PART);
  const ok = srcPartId===PART.id && AU.currentSrc && AU.currentSrc.indexOf(nsrc)>=0
             && AU.readyState>=1 && (isNaN(AU.duration) || Math.abs(AU.duration-PART.total)<3);
  if(ok) return false;                          // 既に正しい音源が載っている
  AU.src=nsrc; AU.load(); srcPartId=PART.id;     // 別パート/未ロード→確実に差し替えてロード
  return true;                                   // 差し替えた(currentTimeは0に戻る)
}
// 再生ボタン: 停止中に押されたら、音声位置が今のカードの範囲外(リロード直後は0秒=先頭)なら頭出しし直してから鳴らす。
// iOSはこのタップが初めての操作なので、ここで初めて読み込み・シークが効く。カード内での一時停止からの再開は位置を触らない。
function togglePlay(){
  if(!AU.paused){AU.pause();return;}
  if(ensureAudioSource()){ playCard(active); return; }   // 音源が別パートだった→正しい音源を載せて頭出し再生(取り違え自己修復)
  const c=CARDS[active];
  if(c && (AU.currentTime<c.start-1 || AU.currentTime>=c.end-0.2)) replay();   // 位置がカード外/終端際=頭出しして再生(replayが強制シーク、失敗はreconcileが補正 Bug2/Bug6)
  else AU.play().catch(()=>{});                                                // カード内での一時停止→続きから再開
}
function trySeek(start){   // seekable範囲が目標をカバーしていれば頭出し。効いたら true
  try{
    const s=AU.seekable;
    if(s&&s.length&&s.end(s.length-1)>=start-0.5){AU.currentTime=start;return AU.currentTime>=start-1;}
    if(AU.readyState>=1){AU.currentTime=start;return AU.currentTime>=start-1;}
  }catch(e){}
  return false;
}
function playCard(i, noPlay){const c=CARDS[i];if(!c)return;
  const start=c.start+0.02, my=++seekSeq;
  // 各パートの1問目は先頭に約15〜22秒のイントロがあり、card開始は0秒でない。ここへ頭出しする
  const run=()=>{if(my!==seekSeq)return;
    if(AU.currentTime<start-0.35 || AU.currentTime>=c.end) trySeek(start);   // 既にこのカード内で鳴っていれば頭出ししない(境界の巻き戻し/二度鳴り防止 Bug1a)
    try{AU.playbackRate=speed;AU.defaultPlaybackRate=speed;}catch(e){}        // 速度はロード後に適用(iOSがsrc差替時1.0xへ戻すため Bug5)
    if(noPlay){AU.pause();} else {AU.play().catch(()=>{const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PLAY;});}};
  if(AU.readyState>=1)run(); else AU.addEventListener('loadedmetadata',run,{once:true});
  // iOS対策: メタデータ後もseekableが0のことがあり頭出しが無視される→0秒(イントロ)から鳴って画面とズレる。
  // 目標より手前で鳴っていたら、seekableが広がるまで数回リトライ(前進中の正常再生には触れない)
  let tries=0;
  const fix=()=>{if(my!==seekSeq)return; if(AU.currentTime<start-2)trySeek(start); if(++tries<12)setTimeout(fix,250);};
  setTimeout(fix,200);
  document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));if(!noPlay)document.getElementById('wave'+i)?.classList.add('on');
  if(noPlay){const b=document.getElementById('play'+i);if(b)b.innerHTML=IC_PLAY;}   // 復元時は自動再生せず▶(停止中)表示。1タップで頭出し位置から鳴る
  revealed[i]=revealed[i]||false;paintText(i);updateEye();}
function goCard(i){if(i<0||i>=CARDS.length)return;const f=document.getElementById('feed'),el=f.querySelector('.card[data-i="'+i+'"]');if(el)f.scrollTo({top:el.offsetTop,behavior:'smooth'});}  // 対象カードのoffsetTopへ
function goNextPart(){const np=(partIdx+1)<DATA.parts.length?partIdx+1:0;openPart(np,0);}  // パート末→次パート(Eの次はAに戻る)
function goPrevPart(){const pp=(partIdx-1+DATA.parts.length)%DATA.parts.length;const last=DATA.parts[pp].chapters.filter(c=>!c.tail).length-1;openPart(pp,Math.max(0,last));}  // パート頭→前パートの最終カードへ(Aの前はEへ)
function replay(){const c=CARDS[active];if(!c)return;lastSwipe=Date.now();trySeek(c.start+0.02);AU.play().catch(()=>{});}  // 頭からもう一回(seek安全化。効かなければreconcileが直近操作として合わせ直す Bug6)

// ===== 音声の位置を正として、表示(active/本文/スクロール)をそこへ追従させる =====
// 旧: 自動送りが goCard(スクロール)経由でactiveを更新→背景/ロック中はscrollイベントが止まり表示が固まって音声とズレた。
function audioCardOf(t){ for(let i=0;i<CARDS.length;i++){ if(t>=CARDS[i].start-0.05 && t<CARDS[i].end) return i; } return -1; }
function followAudioToCard(i){   // 表示だけ音声のカードへ合わせる(seekしない=音声はもうそこに居る)
  active=i;
  document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));
  if(!AU.paused)document.getElementById('wave'+i)?.classList.add('on');
  revealed[i]=revealed[i]||false; paintText(i); updateEye();
  const f=document.getElementById('feed'), el=f.querySelector('.card[data-i="'+i+'"]');
  if(el && Math.abs(f.scrollTop-el.offsetTop)>10) f.scrollTo({top:el.offsetTop,behavior:'smooth'});
  document.getElementById('hint')?.classList.add('hide'); saveState();
}
function reconcile(){   // 表示カードと鳴っている音声がズレていたら合わせる(自動送り/背景復帰/シーク失敗を自己修復)
  if(!CARDS.length || AU.paused || switching) return;
  const c=CARDS[active], ac=audioCardOf(AU.currentTime);
  if(Date.now()-lastSwipe < 1200){ if(c && ac!==active) trySeek(c.start+0.02); return; }  // 直近スワイプ直後は表示を正=音声を合わせる(イントロ0秒でも)
  if(ac<0 || ac===active) return;
  if(!auto && ac>active){ AU.pause(); return; }                 // 自動送りOFF: 次に進めず現カードで止める
  followAudioToCard(ac);                                        // 通常: 音声を正=表示を追従(スクロールが止まる背景でも復帰時に合う)
}
AU.addEventListener('timeupdate',()=>{
  const c=CARDS[active];
  if(repeat && c && AU.currentTime>=c.end-0.05){ replay(); return; }   // 1問リピート
  reconcile();
});
AU.addEventListener('ended',()=>{ if(auto) goNextPart(); else AU.pause(); });   // パート音源の終端→次パート(Bug4: timeupdateが末尾閾値に届かず無音停止するのを防ぐ)
setInterval(reconcile, 500);   // 予備: timeupdateが疎な時のズレも拾う
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(reconcile,60); });   // 画面復帰(ロック解除)で表示を音声へ合わせ直す
AU.addEventListener('play',()=>{document.getElementById('wave'+active)?.classList.add('on');const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PAUSE;document.getElementById('hint')?.classList.add('hide');reqWake();});
AU.addEventListener('pause',()=>{document.getElementById('wave'+active)?.classList.remove('on');const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PLAY;});

function veilHTML(i){return `<div class="veil" data-rev="${i}">${IC_EYE}<span>${PART.id==='B'?'英文を見る':'答えを見る'}</span></div>`;}
function paintText(i){const c=CARDS[i],el=document.getElementById('text'+i);if(!el)return;
  if(!revealed[i] && hideAns){el.innerHTML='';updateEye();return;}   // 非表示中は本文を空に。表示は下バーの「答えを見る」で
  document.getElementById('hint')?.classList.add('hide');
  const isDlg=c.dialogue&&c.dialogue.length;
  let h='';
  if(isDlg){ if(c.question){h+=`<div class="en">${c.question}</div>`; if(c.q_yaku)h+=`<div class="yaku">${c.q_yaku}</div>`;}
    h+='<div class="dlg">'+c.dialogue.map(d=>`<div><span>${d.speaker}</span>${d.text}</div>`+(d.yaku?`<div class="dy">${d.yaku}</div>`:'')).join('')+'</div>'; }   // 会話は質問の直下に全文表示(下に埋もれないように)
  else if(c.en){if(c.kana)h+=`<div class="kana">${c.kana}</div>`; h+=`<div class="en">${c.en}</div>`; if(c.yaku)h+=`<div class="yaku">${c.yaku}</div>`;}
  if(PART.id==='D'&&c.passage){   // Part D: 聞いた話の全文を見せ、答えの手がかりの一文を太字で強調(要点リストは廃止)
    const pe=c.key_line&&c.passage.indexOf(c.key_line)>=0?c.passage.split(c.key_line).join('<b>'+c.key_line+'</b>'):c.passage;
    const py=c.passage_yaku&&c.key_line_yaku&&c.passage_yaku.indexOf(c.key_line_yaku)>=0?c.passage_yaku.split(c.key_line_yaku).join('<b>'+c.key_line_yaku+'</b>'):c.passage_yaku;
    h+=`<div class="pass"><div class="pk">本文<span>太字が答えの手がかり</span></div><div class="pen">${pe}</div>${py?`<div class="pyaku">${py}</div>`:''}</div>`;
  }
  if(c.bone&&c.bone.length&&PART.id!=='D')h+=`<div class="row"><span class="k">要点</span><span class="v">${c.bone.join(' / ')}</span></div>`;
  if(c.bone_en&&c.bone_en.length)h+=`<div class="row"><span class="k">使える単語</span><span class="v">${c.bone_en.join(' / ')}</span></div>`;   // Part E: 日本語→英語の橋
  if(c.answer&&PART.id!=='B')h+=`<div class="row"><span class="k">答え</span><span class="v"><b>${c.answer}</b>${c.a_yaku?'　'+c.a_yaku:''}</span></div>`;
  if(c.answer_full&&PART.id!=='B')h+=`<div class="row"><span class="k">回答例</span><span class="v">${c.answer_full}</span></div>`;
  if(c.target)h+=`<div class="row"><span class="k">解説</span><span class="v"><b>${c.target}</b> → ${c.target_kana||''}${c.kotsu?`<div class="tip">${c.kotsu}</div>`:(c.kind&&TIP[c.kind]?`<div class="tip">${TIP[c.kind]}</div>`:'')}</span></div>`;   // kotsuがあれば「どこを聞くか」を優先表示、無ければ崩れ種別の一言
  else if(c.memo&&PART.id!=='D')h+=`<div class="row"><span class="k">手がかり</span><span class="v">${c.memo}</span></div>`;   // Part Dは本文の太字が手がかりを兼ねる
  if(c.retell)h+=`<div class="row"><span class="k">再話例</span><span class="v">${c.retell}${c.retell_yaku?'　'+c.retell_yaku:''}</span></div>`;        // Part E
  if(c.retell_min)h+=`<div class="row"><span class="k">最低限</span><span class="v">${c.retell_min}${c.retell_min_yaku?'　'+c.retell_min_yaku:''}</span></div>`;  // Part E: これだけ言えば0点回避
  el.innerHTML=h;
  updateEye();   // 下バーの「答えを見る/隠す」を今の表示状態に合わせる
}


if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('nexttrack',()=>goCard(active+1));       // 送り＝次の文
  navigator.mediaSession.setActionHandler('previoustrack',()=>replay());           // 戻し＝もう一回
}

const BUILD='0801-18';
try{const bd=document.getElementById('build');if(bd)bd.textContent='build '+BUILD;}catch(e){}

// ===== デバッグ表示(URLに debug を含めると内部状態を画面に出す) =====
if(location.href.indexOf('debug')>=0){
  const dbg=document.createElement('div');
  dbg.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:rgba(0,0,0,.88);color:#0f0;font:13px/1.5 ui-monospace,monospace;padding:8px 10px;pointer-events:none;white-space:pre-wrap';
  document.body.appendChild(dbg);
  const audioCard=()=>{ if(!CARDS.length)return '-'; for(let i=0;i<CARDS.length;i++){ if(AU.currentTime>=CARDS[i].start-0.3 && AU.currentTime<CARDS[i].end) return i; } return '?'; };
  setInterval(()=>{
    const ac=audioCard(), f=document.getElementById('feed');
    const want=PART?partAudio(PART):'-', got=(AU.currentSrc||'').split('/').pop()||'-';
    const srcOk=PART&&got.indexOf(want)>=0;
    dbg.textContent='build '+BUILD+'   part='+partIdx+'\n'
      +'表示カード='+active+'    音声カード='+ac+(ac===active?'   ✅一致':'   ❌ズレ')+'\n'
      +'音源 got='+got+(srcOk?'  ✅':'  ❌ want='+want)+'  dur='+(isNaN(AU.duration)?'-':AU.duration.toFixed(0))+'/'+(PART?PART.total.toFixed(0):'-')+'\n'
      +'t='+(AU.currentTime||0).toFixed(1)+'  paused='+AU.paused+'  rs='+AU.readyState+'  seek='+(AU.seekable&&AU.seekable.length?AU.seekable.end(0).toFixed(0):0)+'\n'
      +'scrollTop='+(f?Math.round(f.scrollTop):'-')+'  switching='+switching;
  },200);
}
</script>
