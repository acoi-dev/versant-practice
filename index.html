<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Versant 練習</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14151a; --sub:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd;
    --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5; --flashbg:rgba(0,0,0,.05);
    --ui:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  /* 寝る前用のダーク（純黒でなく目に優しい濃色） */
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e9ebf0; --sub:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f;
           --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20; --flashbg:rgba(255,255,255,.08); }
  }
  :root[data-theme="dark"]{ --ink:#e9ebf0; --sub:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f;
           --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20; --flashbg:rgba(255,255,255,.08); }
  :root[data-theme="light"]{ --ink:#14151a; --sub:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd;
           --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5; --flashbg:rgba(0,0,0,.05); }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:var(--ui);color:var(--ink);font-feature-settings:"palt" 1;-webkit-user-select:none;user-select:none;touch-action:manipulation}

  /* ===== ホーム ===== */
  /* ホームはプレイヤーの上にかぶさるオーバーレイ（画面遷移でなくその場で開閉） */
  #home{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 46px) 24px calc(env(safe-area-inset-bottom) + 84px);transition:opacity .18s ease,transform .18s ease}
  #home.off{opacity:0;transform:scale(.99);pointer-events:none}
  #home::-webkit-scrollbar{display:none}
  /* 右上の閉じる×（ホーム・設定 共通） */
  .closex{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:12;border:1px solid var(--line2);background:var(--bg);color:var(--sub);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:24px;line-height:1}
  .closex[hidden]{display:none}
  .pop .closex{position:absolute;top:10px;right:12px}
  /* パートを閉じる×は右下（親指位置）。設定の×は上のまま */
  #homeClose{top:auto;bottom:calc(env(safe-area-inset-bottom) + 16px);right:16px}
  .brand{font-size:26px;font-weight:600;letter-spacing:-.02em}
  .tag{font-size:13px;color:var(--sub);margin:6px 0 28px}
  .plist{display:flex;flex-direction:column;gap:11px}
  .disc{font-size:11px;color:var(--faint);line-height:1.75;margin-top:28px;text-align:center;padding:0 4px}  /* 非公式の免責 */
  .disc .r{font-size:8px;vertical-align:super}
  .build{font-size:10px;color:var(--faint);text-align:center;margin-top:12px;letter-spacing:.04em}  /* キャッシュ判別用のbuild番号 */
  .pcard{border:1px solid var(--line2);border-radius:16px;padding:15px 20px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .pcard:active{background:var(--hover)}
  .pcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .pcard .eb{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);font-weight:600}
  .pcard .meta{font-size:11.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pcard .ttl{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .pcard .desc{font-size:12.5px;color:var(--sub)}
  .pcard.speak{text-decoration:none;color:inherit}        /* 話すモード導線(別ページ遷移) */
  .pcard.speak .eb{color:var(--accent)}                    /* 家用モードだと分かるよう見出しだけアクセント色 */
  .ghdr{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:16px 0 -2px}  /* ホームのグループ見出し(本番れんしゅう/きたえる) */
  .plist>.ghdr:first-child{margin-top:2px}
  /* 受験日カウントダウン(ホーム上部・罫線のみ/塗らない/アクセント1色) */
  .cdown{margin:4px 0 2px;padding:2px 0 16px;border-bottom:1px solid var(--line2)}
  .cdown .cd-main{display:flex;align-items:baseline;gap:9px}
  .cdown .cd-num{font-size:29px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
  .cdown .cd-lb{font-size:15px;font-weight:600;color:var(--ink)}
  .cdown .cd-sub{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.65}
  .cdown .cd-set{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cdown input[type=date]{font:inherit;font-size:14px;color:var(--ink);background:none;border:1px solid var(--line2);border-radius:9px;padding:8px 11px}
  .cdown .cd-link{font-size:12px;color:var(--sub);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  #streak{border-bottom:0;padding-bottom:6px}   /* 連続日数ブロック。区切り線は下の受験日ブロックに任せる */
  .pcard .meta .dq{color:var(--accent);font-weight:600}   /* 右上の「N/M 済み」の数字だけアクセント */
  .pcard.lesson{text-decoration:none;color:inherit}        /* イメージ英文法(別ページへ) */
  .pcard .eb.kt{color:var(--accent)}                       /* きたえる系は見出しをアクセント色で区別 */
  .pcard.soon{opacity:.5}                                  /* 近日(タップ不可) */
  .pcard.soon:active{background:none}
  /* イメージ英文法をアプリ内オーバーレイ(iframe)で開く=ページ遷移させない */
  #lesson{position:fixed;inset:0;z-index:16;background:var(--bg);display:flex;flex-direction:column}
  #lesson.off{display:none}
  .lhead{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .lback{border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;padding:6px 8px;-webkit-tap-highlight-color:transparent}
  .lhead .lt{font-weight:700;font-size:15px;color:var(--ink)}
  #lframe{flex:1 1 auto;width:100%;border:0;display:block}
  .phead{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:22px 2px 3px}  /* 聞く/話すの区切り見出し */

  /* ===== フィード ===== */
  #app{position:fixed;inset:0;transition:opacity .22s ease,transform .22s ease}
  #app.off{opacity:0;transform:translateY(10px);pointer-events:none}
  #feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  #feed::-webkit-scrollbar{display:none}
  .card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 60px) 24px calc(env(safe-area-inset-bottom) + 88px)}
  /* パート末の番兵カード＝スワイプ/タップで次パートへ */
  .nextcard,.prevcard{justify-content:center;align-items:center;text-align:center}
  .nextwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
  .nextlabel{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
  .nextbtn{font:inherit;font-size:16px;font-weight:600;color:var(--accent);background:none;
    border:1px solid var(--line2);border-radius:14px;padding:16px 30px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px}
  .nextbtn small{font-size:12px;color:var(--sub);font-weight:400;letter-spacing:.01em}
  .plabel{font-size:12.5px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
  .plabel b{color:var(--ink);font-weight:600}

  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0}
  .task{font-size:13px;color:var(--sub);font-weight:500;letter-spacing:.02em}
  .wave{display:flex;gap:5px;align-items:center;height:44px}
  .wave b{width:5px;height:12px;background:var(--line2);border-radius:3px;display:block}
  .wave.on b{background:var(--accent);animation:w .9s ease-in-out infinite}
  .wave.on b:nth-child(2){animation-delay:.1s}.wave.on b:nth-child(3){animation-delay:.2s}
  .wave.on b:nth-child(4){animation-delay:.3s}.wave.on b:nth-child(5){animation-delay:.15s}.wave.on b:nth-child(6){animation-delay:.25s}
  @keyframes w{0%,100%{height:11px}50%{height:38px}}

  .text{padding-top:16px;min-height:118px;max-height:48dvh;overflow-y:auto}  /* containを外し、答え欄の端まで来たらカード送りに繋がるように(答え表示中もスワイプで次へ) */
  .text::-webkit-scrollbar{display:none}
  .veil{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--sub);padding:22px 0;cursor:pointer}
  .veil svg{width:27px;height:27px;display:block;color:var(--sub)}
  .veil span{font-size:12.5px;color:var(--sub)}
  /* 答えを再度隠すボタン（表示中の先頭） */
  .hidebtn{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;cursor:pointer;padding-bottom:11px;margin-bottom:3px;border-bottom:1px solid var(--line)}
  .hidebtn svg{width:15px;height:15px}
  /* 会話を全部見る（Part C・畳んでおく） */
  .dlgtoggle{color:var(--accent);font-size:13px;cursor:pointer;padding:11px 0 2px}
  .kana{font-size:13px;color:var(--sub);margin-bottom:5px;letter-spacing:.02em;line-height:1.6}  /* 英文の上・どう聞こえるか。かたまりで区切る */
  .kana b{color:var(--ink);font-weight:700}  /* 強く・高く読むかたまり=抑揚 */
  .enlab{font-size:12px;color:var(--sub);margin-bottom:6px}   /* 大きな英文が「質問」なのか「話(聞く本文)」なのかを示す小見出し(本文ラベルと同じ濃さ) */
  .en{font-size:20px;line-height:1.5;font-weight:500;letter-spacing:-.005em}
  .yaku{font-size:14px;color:var(--sub);margin-top:6px}
  .tip{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.65}  /* 解説の一言 */
  .pass{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}  /* Part D 本文全文 */
  .pass.top{margin-top:0;padding-top:0;border-top:none}   /* 本文を先頭に置く時は上罫線・余白を消す(へんな線対策) */
  .pass .pk{font-size:12px;color:var(--sub);margin-bottom:7px}
  .pass .pk span{margin-left:8px;color:var(--faint);font-size:11px}
  .pass .pen{font-size:15px;line-height:1.75;color:var(--ink)}
  .pass .pen b{font-weight:700}          /* 答えの手がかりの一文は太字で強調(色は付けず濃淡で) */
  .pass .pyaku{font-size:13px;line-height:1.75;color:var(--sub);margin-top:8px}
  .pass .pyaku b{font-weight:700;color:var(--ink)}
  .lseg{transition:color .1s ease}       /* リスニング本文のなぞり単位(設定の.segと名前衝突を避けlseg) */
  .lseg.lit{color:var(--accent)}         /* 再生中の文/行をなぞる青 */
  .pass .pen .lseg.key{font-weight:700}   /* Part D 答えの手がかりの一文(太字) */
  .row{display:flex;gap:8px;margin-top:15px;font-size:14px}
  .row .k{color:var(--sub);white-space:nowrap;font-size:12px;padding-top:2px;min-width:3.6em;flex-shrink:0}   /* ラベルは縮めない(長いラベルが縮んで内容と重なるのを防ぐ) */
  .row .v{color:var(--ink)}
  .row .v b{font-weight:600}
  .row.ex .v b{font-weight:700;font-size:15.5px}   /* 解答例の「最低限の答え」は気持ち大きく・濃く(周囲14px→15.5px) */
  body.bigtext .row.ex .v b{font-size:17px}
  .dlg.first{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line)}  /* Part C: 会話を先頭に置き、質問との間に区切り */
  .dlg.first + .enlab{margin-top:0}   /* Part C: 会話の直後は質問ラベル。会話とラベルを詰める(enlabを挟んだので隣接対象を.enから.enlabへ) */
  .dlg>div{font-size:14px;margin-bottom:14px;padding-left:46px}   /* 発話ごとに少し余白。行だけ(直接の子)を左ガター分インデント。子孫の.dyにも効くと二重インデントになるので > で限定 */
  .dlg span:not(.lseg){color:var(--sub);font-size:11.5px;margin-right:0;display:inline-block;width:46px;margin-left:-46px;vertical-align:top}   /* 話者ラベルを左ガターに固定=英文が全行そろう。台詞本文の.lsegには当てない(会話が11.5px灰色に潰れ・bigtext無効になる回帰を防ぐ) */
  .dlg .dy{color:var(--sub);font-size:12px;margin:0 0 8px 0}   /* 訳は発話divのpadding-left(46px)で既に英文と同じ左端。ここで足すと二重インデントになる */
  /* 「文字を大きく」ON時 */
  body.bigtext .en{font-size:23px}
  body.bigtext .yaku{font-size:16px}
  body.bigtext .row{font-size:15.5px}
  body.bigtext .dlg div{font-size:16px}
  body.bigtext .dlg .dy{font-size:14px}

  .bot{margin-top:14px}
  /* 再生/停止を画面中央に固定、もう一回と速度を左右に置く */
  .yt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:6px}
  .yb{border:0;background:none;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
  .yb:active{opacity:.5}
  .yb.rep{width:46px;height:46px;justify-self:center}
  .yb.play{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);justify-self:center}
  .spd{border:1px solid var(--line2);background:none;color:var(--sub);font:inherit;font-size:13px;padding:9px 15px;border-radius:22px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;justify-self:center}

  /* ===== 発音採点(押し続け録音のマイク＋結果シート) ===== */
  .spdrow{display:flex;justify-content:center;margin-bottom:14px}   /* 速度は再生ボタンの上段に置く */
  .yb.mic{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line2);color:var(--ink);justify-self:center}   /* 録音: タップで開始、もう一度で停止して採点 */
  .yb.mic:active{opacity:1}
  .yb.mic.rec{border-color:#e5484d;color:#e5484d;animation:micpulse 1.1s ease-in-out infinite}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.30)}50%{box-shadow:0 0 0 9px rgba(229,72,77,0)}}
  .miclbl{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#e5484d;opacity:0;transition:opacity .15s;pointer-events:none}   /* 録音中の合図はマイクボタンの真上に(浮かせず親=マイクに紐付き=重ならない) */
  .yb.mic.rec .miclbl{opacity:1}
  .spkr{position:fixed;inset:0;z-index:14;display:none}
  .spkr.show{display:block}
  .spkr-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
  .spkr-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line2);
    padding:22px 22px calc(env(safe-area-inset-bottom) + 24px);max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .24s ease}
  .spkr.show .spkr-sheet{transform:translateY(0)}
  .spkr-x{position:absolute;top:12px;right:14px;border:1px solid var(--line2);background:var(--bg);color:var(--sub);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .spkr-body{padding-top:14px}
  .sk-top{display:flex;align-items:center;gap:20px;margin-bottom:14px}
  .sk-ring{--v:0;width:84px;height:84px;flex:0 0 auto;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--line2) 0);display:flex;align-items:center;justify-content:center;position:relative}
  .sk-ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
  .sk-ring b{position:relative;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums}
  .sk-ring i{position:relative;font-style:normal;font-size:12px;color:var(--sub);margin-left:1px}
  .sk-sub{font-size:13px;flex:1}
  .sk-sub .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;margin-bottom:4px}
  .sk-sub .r{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
  .sk-sub .r span:first-child{color:var(--sub)}
  .sk-sub .r span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
  .sk-words{font-size:19px;line-height:1.9;margin:4px 0}
  .sk-words .w.bad{color:#e5484d;text-decoration:underline;text-decoration-color:#e5484d;text-underline-offset:3px}
  .sk-leg{font-size:11.5px;color:var(--faint)}
  .sk-leg b{color:#e5484d;font-weight:600}
  .sk-adv{font-size:14px;line-height:1.8;border-top:1px solid var(--line);padding-top:14px;margin-top:12px}
  .sk-adv .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;display:block;margin-bottom:5px}
  .sk-heard{font-size:12px;color:var(--faint);margin-top:10px}
  .sk-heard b{color:var(--sub);font-weight:600}
  .sk-status{text-align:center;font-size:15px;color:var(--sub);padding:34px 0}
  .sk-words .w{cursor:pointer}
  .sk-tap{color:var(--accent)}
  .sk-actions{display:flex;gap:9px;margin-top:18px}
  .sk-btn{flex:1;font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center;white-space:nowrap}
  .sk-btn:active{background:var(--hover)}
  .sk-btn.sk-again{border-color:var(--accent);color:var(--accent)}
  .sk-btn.sk-recing{border-color:#e5484d;color:#e5484d;animation:skpulse 1.1s ease-in-out infinite}   /* 録音中の停止ボタン */
  .sk-verdict{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .sk-verdict span{font-size:12.5px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
  .sk-load{font-size:15px;font-weight:500;color:var(--sub);animation:skpulse 1.2s ease-in-out infinite}   /* 採点中の待ち表示 */
  @keyframes skpulse{50%{opacity:.4}}

  .hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 104px);text-align:center;font-size:12px;color:var(--sub);pointer-events:none;transition:.5s}
  .hint.hide{opacity:0}
  .hint .up{display:block;font-size:19px;margin-bottom:3px;animation:bob 1.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  /* パート切替の中央バナー(境目ページの代わり・1.6秒でフェード) */
  .pbanner{position:fixed;left:0;right:0;top:40%;z-index:30;text-align:center;pointer-events:none;opacity:0}
  .pbanner.show{animation:pbfade 1.6s ease forwards}
  .pbanner .pb-id{font-size:12px;letter-spacing:.14em;color:var(--sub);margin-bottom:7px}
  .pbanner .pb-ttl{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
  @keyframes pbfade{0%{opacity:0;transform:translateY(9px)}14%{opacity:1;transform:translateY(0)}68%{opacity:1;transform:translateY(0)}100%{opacity:0}}

  /* 上部：タイトル中央＋設定は右上（あまり使わないので親指圏外でOK） */
  .head{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;padding:0 64px;display:flex;justify-content:center;align-items:center;z-index:5}
  .htitle{text-align:center;font-size:13px;color:var(--ink);font-weight:600}
  .topgear{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:16px;z-index:9;border:1px solid var(--line2);background:none;color:var(--sub);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .topgear svg{width:22px;height:22px;display:block}

  /* ===== 下部の片手操作バー（ホーム／答え表示／設定） ===== */
  /* 3カラムgridで中央ボタンを画面ど真ん中に固定（幅差でずれない） */
  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:10px 20px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg)}
  .navb{border:1px solid var(--line2);background:none;color:var(--sub);cursor:pointer;font:inherit;
    display:flex;align-items:center;justify-content:center;gap:7px}
  .navb:active{background:var(--hover)}
  /* よく使う「答えを見る/隠す」は中央、ホームは右下 */
  .navb.eye{grid-column:2;justify-self:center;font-size:14px;color:var(--ink);padding:12px 20px;border-radius:26px}
  .navb svg{width:20px;height:20px;display:block}
  .navb.eye[hidden]{display:none}
  .navb.home{grid-column:3;justify-self:end;width:46px;height:46px;padding:0;border-radius:50%}

  /* ===== 設定シート ===== */
  /* ===== 設定ポップオーバー（歯車の直下にその場で・画面遷移なし） ===== */
  .popbg{position:fixed;inset:0;z-index:20;display:none}
  .popbg.on{display:block}
  .pop{position:fixed;top:calc(env(safe-area-inset-top) + 56px);right:16px;width:min(288px,86vw);
    background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:4px 16px 12px;z-index:21;
    max-height:calc(100dvh - 100px);overflow-y:auto;
    opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity .13s ease,transform .13s ease;pointer-events:none}
  .pop::-webkit-scrollbar{display:none}
  .pop.on{opacity:1;transform:none;pointer-events:auto}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .setrow:first-of-type{border-top:0;margin-top:30px}
  .setrow.col{flex-direction:column;align-items:stretch;gap:9px}
  .setrow .lb b{display:block;font-size:13.5px;font-weight:500}
  .setrow .lb span{font-size:11.5px;color:var(--sub)}
  .sw{width:44px;height:26px;border-radius:15px;border:1px solid var(--line2);background:var(--hover);position:relative;cursor:pointer;flex:none;transition:.2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);transition:.2s}
  .sw.on{background:var(--accent);border-color:var(--accent)}
  .sw.on::after{left:19px;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12.5px;padding:8px 0;cursor:pointer;border-left:1px solid var(--line2)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--accent);color:var(--bg)}
  .pophint{font-size:11px;color:var(--faint);line-height:1.6;padding-top:12px;border-top:1px solid var(--line)}

  /* ===== ホーム：目安 ===== */
  .pcard{position:relative}
  .pcard.current{border-color:var(--accent)}   /* 今いるパートだけ枠線(選択中の意味) */
</style>
</head>
<body>
<!-- ホーム -->
<div id="home">
  <button class="closex" id="homeClose" aria-label="閉じる" hidden>&times;</button>
  <div class="brand">Versant 練習</div>

  <div class="cdown" id="cdown"></div>
  <div class="plist" id="plist"></div>
  <p class="disc">非公式の練習アプリです。Versant<span class="r">®</span> は Pearson Education 社の商標で、本アプリは Pearson 社および Versant と関係ありません。掲載の例題はすべてオリジナルで、本番の試験問題ではありません。</p>
  <div id="build" class="build"></div>
</div>

<!-- イメージ英文法(別ページでなくアプリ内オーバーレイで開く) -->
<div id="lesson" class="off" aria-hidden="true">
  <iframe id="lframe" title="イメージ英文法" loading="lazy"></iframe>
</div>

<!-- フィード -->
<div id="app" class="off">
  <div class="head">
    <div class="htitle" id="htitle"></div>
  </div>
  <button class="topgear" id="mGear" aria-label="設定"></button>
  <div id="feed"></div>
  <div class="pbanner" id="pbanner" aria-hidden="true"></div>   <!-- パート切替の中央バナー(境目ページの代わり・1.5秒でフェード) -->
  <div class="hint" id="hint"><span class="up">↑</span>上にフリックで次の問題</div>
  <!-- 片手操作バー（よく使う「答えを見る/隠す」は中央、ホームは右下） -->
  <div class="navbar">
    <button class="navb eye" id="eyeToggle"></button>
    <button class="navb home" id="back" aria-label="パート一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
  </div>
  <!-- 発音採点シート: 録音→採点の結果を同じ画面内(下から)に表示 -->

    <div class="spkr-bg" id="spkrBg"></div>
    <div class="spkr-sheet">
      <button class="spkr-x" id="spkrX" aria-label="閉じる">&times;</button>
      <div class="spkr-body" id="spkrBody"></div>
    </div>
  </div>
</div>

<!-- 設定ポップ（右上の歯車の直下にその場で開く。画面遷移なし） -->
<div class="popbg" id="popbg"></div>
<div class="pop" id="pop">
  <button class="closex" id="popClose" aria-label="閉じる">&times;</button>
  <div class="setrow">
    <div class="lb"><b>自動送り</b><span>終わると次へ自動で進む</span></div>
    <div class="sw on" id="swAuto" role="switch" aria-checked="true"></div>
  </div>
  <div class="setrow">
    <div class="lb"><b>1問リピート</b><span>次に進まず同じ文を繰り返す</span></div>
    <div class="sw" id="swRepeat" role="switch" aria-checked="false"></div>
  </div>
  <div class="setrow">
    <div class="lb"><b>答えを隠す</b><span>最初は耳だけで挑戦する</span></div>
    <div class="sw on" id="swHide" role="switch" aria-checked="true"></div>
  </div>
  <div class="setrow col">
    <div class="lb"><b>標準の速さ</b></div>

      <button data-sp="1">1.0x</button><button data-sp="0.85">0.85x</button><button data-sp="0.7">0.7x</button>

  </div>
  <div class="setrow col">
    <div class="lb"><b>表示モード</b></div>
    <div class="seg" id="segTheme">
      <button data-th="auto">自動</button><button data-th="light">ライト</button><button data-th="dark">ダーク</button>
    </div>
  </div>
  <div class="setrow">
    <div class="lb"><b>画面をスリープさせない</b><span>学習中は画面を消さない</span></div>
    <div class="sw" id="swWake" role="switch" aria-checked="false"></div>
  </div>
</div>
<audio id="au" preload="auto"></audio>

<script>
const AU=document.getElementById('au');
const TASK={A:'質問に短く答える',B:'聞いて繰り返す',C:'会話を聞いて答える',D:'話を聞いて答える',E:'自分の言葉で言い直す',F:'意見を述べる',G:'弱く消える音を聞き取る'};
let DATA=null,PART=null,CARDS=[],auto=true,active=0,revealed={},speed=1,hideAns=true,dlgShown={},partIdx=null;
const SPEEDS=[1,0.85,0.7];                                   // 速度は3段(設定パネルと同じ)。カードのタップもこの順で回す
const spdTxt=s=>s.toFixed(2).replace(/0$/,'')+'x';          // 速度表示を統一(1.0x/0.85x/0.7x)。初期もタップも設定も同じ表記に
const ARROW='<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/>';
const IC_REPLAY='<svg viewBox="0 0 24 24" width="26" height="26">'+ARROW+'</svg>';
const IC_EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_EYEOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20C5 20 2 12 2 12a18.5 18.5 0 0 1 5.1-6M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
const IC_PLAY='<svg viewBox="0 0 24 24" width="30" height="30"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const IC_PAUSE='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>';
const IC_MIC='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="9" y1="21" x2="15" y2="21"/></svg>';
const SPEAK_API='https://versant-speaking-api-s8gk.vercel.app';   // 発音採点API(OpenAI Whisper+語一致+GPT)。押し続け録音→離すと採点
const IC_GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
document.getElementById('mGear').innerHTML=IC_GEAR;

// ===== テーマ（自動=端末に合わせる / ライト / ダーク・保存） =====
function applyTheme(){const s=localStorage.getItem('theme');
  if(s==='light'||s==='dark')document.documentElement.setAttribute('data-theme',s);
  else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('#segTheme button').forEach(b=>b.classList.toggle('on',b.dataset.th===(s||'auto')));}
applyTheme();
document.querySelectorAll('#segTheme button').forEach(b=>b.onclick=()=>{
  const th=b.dataset.th; if(th==='auto')localStorage.removeItem('theme'); else localStorage.setItem('theme',th); applyTheme();});

// ===== 設定シート開閉 =====
const POP=document.getElementById('pop'),POPBG=document.getElementById('popbg');
function openSet(){POPBG.classList.add('on');requestAnimationFrame(()=>POP.classList.add('on'));}
function closeSet(){POP.classList.remove('on');POPBG.classList.remove('on');}
document.getElementById('mGear').onclick=openSet;   // 歯車の直下にその場で出す
POPBG.onclick=closeSet;                             // 外側タップで閉じる(画面遷移なし)

// ===== 自動送り（基本ON・保存） =====
const SW=document.getElementById('swAuto');
auto=localStorage.getItem('auto')!=='0';
SW.classList.toggle('on',auto);SW.setAttribute('aria-checked',auto);
SW.onclick=()=>{auto=!auto;SW.classList.toggle('on',auto);SW.setAttribute('aria-checked',auto);localStorage.setItem('auto',auto?'1':'0');};

// ===== 答えを隠す（基本ON・保存。オフなら最初から答えを表示） =====
const SWH=document.getElementById('swHide');
hideAns=localStorage.getItem('hide')!=='0';
SWH.classList.toggle('on',hideAns);SWH.setAttribute('aria-checked',hideAns);
SWH.onclick=()=>{hideAns=!hideAns;SWH.classList.toggle('on',hideAns);SWH.setAttribute('aria-checked',hideAns);localStorage.setItem('hide',hideAns?'1':'0');if(PART)paintText(active);updateEye();};

// ===== 1問リピート（基本OFF・保存。ONだと次に進まず同じ文を繰り返す） =====
let repeat=localStorage.getItem('repeat')==='1';
const SWR=document.getElementById('swRepeat');
SWR.classList.toggle('on',repeat);SWR.setAttribute('aria-checked',repeat);
SWR.onclick=()=>{repeat=!repeat;SWR.classList.toggle('on',repeat);SWR.setAttribute('aria-checked',repeat);localStorage.setItem('repeat',repeat?'1':'0');};

// ===== 標準の再生速度（保存。開いた時の既定速度） =====
speed=parseFloat(localStorage.getItem('spd'))||1;
function syncSpeedSeg(){document.querySelectorAll('#segSpeed button').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.sp)===speed));}
syncSpeedSeg();
document.querySelectorAll('#segSpeed button').forEach(b=>b.onclick=()=>{
  speed=parseFloat(b.dataset.sp);localStorage.setItem('spd',speed);AU.playbackRate=speed;syncSpeedSeg();
  document.querySelectorAll('[data-spd]').forEach(x=>x.textContent=spdTxt(speed));});

// ===== 文字を大きく（基本OFF・保存） =====
let bigText=localStorage.getItem('big')==='1';
const SWB=document.getElementById('swBig');
function applyBig(){document.body.classList.toggle('bigtext',bigText);SWB.classList.toggle('on',bigText);SWB.setAttribute('aria-checked',bigText);}
applyBig();
SWB.onclick=()=>{bigText=!bigText;localStorage.setItem('big',bigText?'1':'0');applyBig();};

// ===== 画面をスリープさせない（Wake Lock・基本OFF・保存） =====
let wakeOn=localStorage.getItem('wake')==='1',wakeLock=null;
const SWW=document.getElementById('swWake');
SWW.classList.toggle('on',wakeOn);SWW.setAttribute('aria-checked',wakeOn);
async function reqWake(){if(wakeOn&&'wakeLock'in navigator&&document.visibilityState==='visible'){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}}
function relWake(){try{if(wakeLock)wakeLock.release();}catch(e){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wakeOn)reqWake();});
SWW.onclick=()=>{wakeOn=!wakeOn;SWW.classList.toggle('on',wakeOn);SWW.setAttribute('aria-checked',wakeOn);localStorage.setItem('wake',wakeOn?'1':'0');wakeOn?reqWake():relWake();};

boot();
function boot(){
  if(window.EMBED){ DATA=window.EMBED; renderHome(); restoreState(); }
  else fetch('player_data.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;renderHome();restoreState();})
       .catch(()=>{document.getElementById('plist').innerHTML='<div class="tag">データが読めません</div>';});
}
// ===== リロードしても今の画面(どのパート・どのカード・一覧を開いていたか)を保つ =====
function saveState(){try{localStorage.setItem('st',JSON.stringify({p:partIdx,c:active,h:!document.getElementById('home').classList.contains('off')}));}catch(e){}}
function restoreState(){let st;try{st=JSON.parse(localStorage.getItem('st'));}catch(e){}
  if(st&&st.p!=null&&DATA.parts&&DATA.parts[st.p]){
    openPart(st.p, st.c||0, true);   // 復元時は自動再生しない(iOSは無操作で鳴らせない→▶表示・1タップで頭出し位置から再生)
    if(st.h){document.getElementById('home').classList.remove('off');markCurrent();saveState();}   // 一覧を開いた状態だったら開いたまま戻す(openPart内のsaveStateがh=falseで上書きするので、ここで開いた状態を保存し直す)
  }}

// ===== 学習の記録(箱): 受験日 / 練習した日 / 言えた率% を localStorage 'vlog' に貯める。既存の'st'(現在位置)とは別 =====
function loadLog(){ try{return JSON.parse(localStorage.getItem('vlog'))||{};}catch(e){return {};} }
function saveLog(o){ try{localStorage.setItem('vlog',JSON.stringify(o));}catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function logPracticeDay(){ const l=loadLog(); l.days=l.days||[]; const t=todayStr(); if(!l.days.includes(t)){ l.days.push(t); saveLog(l); } }   // その日はじめて触れたら1回だけ記録
function logScore(part,said){ const l=loadLog(); l.scores=l.scores||[]; l.scores.push({d:todayStr(),part:part||'',said:said}); if(l.scores.length>500) l.scores=l.scores.slice(-500); saveLog(l); }
// 済み記録: パートごとに、再生した問題のindexを覚える
function logDone(partId,idx){ if(!partId) return; const l=loadLog(); l.done=l.done||{}; const a=l.done[partId]=l.done[partId]||[]; if(!a.includes(idx)){ a.push(idx); saveLog(l); } }
function doneCount(partId){ return ((loadLog().done||{})[partId]||[]).length; }
function prevScore(partId){ const s=(loadLog().scores||[]).filter(x=>x.part===partId); return s.length?s[s.length-1].said:null; }   // そのパートの直近の言えた率(=前回)
// (一覧カードの「前回◯%」表示は削除。前回比は採点画面にのみ表示)
// 済みの定義を[再生]→[話すモードで100点]に変更。旧仕様で貯まった済み記録を一度だけ消す
try{ const _l0=loadLog(); if(_l0.done && !_l0.doneV2){ _l0.done={}; _l0.doneV2=true; saveLog(_l0); } }catch(e){}
function setExamDate(v){ const l=loadLog(); l.examDate=v||null; saveLog(l); renderCountdown(); }
function daysUntil(ds){ const t=new Date(todayStr()+'T00:00:00'), e=new Date(ds+'T00:00:00'); return Math.round((e-t)/86400000); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// 連続日数: 今日(やってれば)or昨日を起点に、練習した日が途切れるまで遡って数える。今日まだでも昨日まで続いていれば維持(今日やれば伸びる)
function streakInfo(){
  const set=new Set(loadLog().days||[]); const doneToday=set.has(todayStr());
  let cur=0, d=new Date(todayStr()+'T00:00:00'); if(!doneToday) d.setDate(d.getDate()-1);
  while(set.has(fmtDate(d))){ cur++; d.setDate(d.getDate()-1); }
  return { streak:cur, doneToday, total:set.size };
}
// ホーム上部「連続日数＋今日やった印」。受験日がなくても効く。責めない優しいトーン(途切れ＝全否定にしない)
function renderStreak(){
  const el=document.getElementById('streak'); if(!el) return;
  const s=streakInfo();
  const tot=s.total>s.streak?'（これまで'+s.total+'日）':'';
  if(s.streak>0){
    el.innerHTML='<div class="cd-main"><span class="cd-num">'+s.streak+'日</span><span class="cd-lb">つづいています</span></div>'
      +'<div class="cd-sub">'+(s.doneToday?'今日もできました。その調子。':'今日の1本で、記録がのびます。')+tot+'</div>';
  } else {

function openPart(pi, startCard, noPlay){   // noPlay=リロード復元時。iOSは無操作で自動再生できないので鳴らさず頭出しだけ
  startCard = startCard || 0;
  const wasPlaying = !noPlay && !AU.paused;   // ★連続再生: この切替の直前に鳴っていたか(ensureAudioSourceがpauseする前に見る)
  switching=true;   // 目標カードに着地するまで判定停止(switchTargetは下でclamp後に設定)
  PART=DATA.parts[pi]; partIdx=pi; CARDS=PART.chapters.filter(c=>!c.tail);
  startCard=Math.min(Math.max(0,startCard|0), Math.max(0,CARDS.length-1));   // 教材再生成でカードが減った時など、保存indexが範囲外でも安全に(Bug7)
  active=startCard; switchTarget=startCard; revealed={}; dlgShown={};
  document.getElementById('homeClose').hidden=false;   // 一度パートを開いたら、以後一覧は×で閉じてプレイヤーに戻れる
  document.getElementById('htitle').textContent=PART.title;
  showPartBanner();   // ★パートが変わったことを中央バナーで一瞬知らせる(境目の空白ページの代わり)
  const _feed=document.getElementById('feed');
  _feed.style.transition='none'; _feed.style.opacity='0';   // ★遷移中は隠す。フィード入替とスクロール頭出しのチラつきを覆い、着地後にふわっと出す
  ensureAudioSource(); AU.playbackRate=speed;   // ★前パートの音源が残らないよう必ずロードし直す(パート間の音ズレ根治)
  if(wasPlaying) AU.play().catch(()=>{});   // ★連続再生: 前パートを鳴らしていたら、差し替え直後に即play()してiOSの再生権(user activation)を切らさない。頭出しはplayCard側が担う
  renderFeed();
  document.getElementById('home').classList.add('off');
  document.getElementById('app').classList.remove('off');
  // 先頭に「前パート」番兵があるので実カードは表示index+1。目的カードへ移動(mandatory snapは一時解除)
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    _feed.style.scrollSnapType='none';
    _feed.style.scrollBehavior='auto';   // ★瞬間移動にする(smoothだと頭出しがアニメして「巻き戻る」ように見える)
    const t=_feed.querySelector('.card[data-i="'+startCard+'"]'); if(t)_feed.scrollTop=t.offsetTop;   // 高さ計算でなく対象カードのoffsetTopへ
    requestAnimationFrame(()=>{ _feed.style.scrollSnapType=''; _feed.style.scrollBehavior='';   // switchingはonscrollが目標カード着地で解除(番兵誤発火防止)
      _feed.style.transition='opacity .22s ease'; _feed.style.opacity='1';   // ★着地後にクロスフェードで表示(ハードなジャンプを見せない)
    });
  }));
  clearTimeout(switchTimer);   // 連続切替: 前回の保険タイマーが今回の切替の途中(opacity=0で覆っている最中)に発火してクロスフェードを潰すのを防ぐ
  switchTimer=setTimeout(()=>{ switching=false; _feed.style.opacity='1'; }, 800);   // 保険: 着地イベントが来なくても解除し、透明のまま固まらせない
  playCard(startCard, noPlay);
  document.getElementById('hint').classList.remove('hide');
  saveState();
  logPracticeDay();   // パートを開いた=今日は練習した、として記録(1日1回)
}

function renderFeed(){
  const feed=document.getElementById('feed');
  feed.innerHTML= CARDS.map((c,i)=>`
    <section class="card" data-i="${i}">
      <div class="plabel"><b>${c.n}</b> / ${CARDS.length}</div>
      <div class="mid">
        <div class="task">${TASK[PART.id]||''}</div>
        <div class="wave" id="wave${i}"><b></b><b></b><b></b><b></b><b></b><b></b></div>
      </div>
      <div class="text" id="text${i}"></div>
      <div class="bot">
        <div class="spdrow"><button class="spd" data-spd>${spdTxt(speed)}</button></div>
        <div class="yt">
          <button class="yb rep" data-rep aria-label="もう一回">${IC_REPLAY}</button>
          <button class="yb play" data-play id="play${i}">${IC_PAUSE}</button>
          ${(SPEAK_ENABLED&&c.en&&SPK_PARTS.has(PART.id))?`<button class="yb mic" data-mic aria-label="録音開始・もう一度押すと停止して採点">${IC_MIC}<span class="miclbl">録音中…</span></button>`:''}
        </div>
      </div>
    </section>`).join('');

  feed.querySelectorAll('.card').forEach(card=>card.addEventListener('click',e=>{
    if(spkRecording && !e.target.closest('[data-mic]')){ stopSpkRec(true); }   // 録音中にマイク以外(再生/もう一回/カード)を押したら録音を止める(採点せず)。以降は通常動作(再生等)
    if(e.target.closest('.veil')){const i=+e.target.closest('.veil').dataset.rev;revealed[i]=true;paintText(i);return;}
    if(e.target.closest('[data-hide]')){const i=+e.target.closest('[data-hide]').dataset.hide;revealed[i]=false;paintText(i);return;}
    if(e.target.closest('[data-dlg]')){const i=+e.target.closest('[data-dlg]').dataset.dlg;dlgShown[i]=true;paintText(i);return;}
    if(e.target.closest('[data-spd]')){speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];AU.playbackRate=speed;document.querySelectorAll('[data-spd]').forEach(x=>x.textContent=spdTxt(speed));if(typeof syncSpeedSeg==='function')syncSpeedSeg();return;}
    if(e.target.closest('[data-rep]')){replay();return;}
    if(e.target.closest('[data-mic]')){toggleSpkRec();return;}   // マイク: タップで録音開始、もう一度タップで停止して採点。タップで再生はさせない
    if(e.target.closest('[data-play]')){togglePlay();return;}
    togglePlay();   // カードのどこをタップしても再生/停止(ダブルタップ廃止=拡大防止)
  }));

  // 今どのカードかは、高さ計算(innerHeight≠100dvhでズレる)でなく「スクロール位置に一番近いカード」で決める
  let tmr;
  feed.onscroll=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{
    const st=feed.scrollTop; let best=null,bd=1e9;
    feed.querySelectorAll('.card').forEach(el=>{const d=Math.abs(el.offsetTop-st);if(d<bd){bd=d;best=el;}});
    if(!best)return;
    const ri=+best.dataset.i;
    if(switching){ if(ri===switchTarget){switching=false;return;} switching=false; }   // 切替の自動スクロール中: 目標カード着地で解除。実カードへ手で動いたら解除して追従
    if(ri!==active){active=ri;lastSwipe=Date.now();document.getElementById('hint')?.classList.add('hide');playCard(ri);saveState();}   // ユーザーが手で送った=この後1.2秒は表示を正とする
  },90);};
  // 境目ページ廃止: 最終カードでさらに上フリック→次パート / 先頭カードでさらに下フリック→前パート(空白ページを挟まず直接遷移)
  let _tsY=0;
  feed.addEventListener('touchstart',e=>{ _tsY=e.touches[0].clientY; },{passive:true});
  feed.addEventListener('touchend',e=>{
    const dy=e.changedTouches[0].clientY-_tsY;   // 負=上フリック(次へ) / 正=下フリック(前へ)
    // 最終カードで上フリック→次パート / 先頭カードで下フリック→前パート。
    // 以前は scrollTop が最下部/最上部かも条件にしていたが、iOSのdvh(アドレスバー出入り)で
    // scrollHeight/clientHeight が揺れ、最終カードにいても「最下部」と見なされず遷移が発火しないことがあった。
    // カード位置(active)とフリック量だけで判定する。
    if(dy<-70 && active===CARDS.length-1) goNextPart();
    else if(dy>70 && active===0) goPrevPart();
  },{passive:true});

  CARDS.forEach((_,i)=>paintText(i));   // 全カードを最初から正しい状態に(隠す=空/常時表示=本文)。スワイプ中のveilチラつき防止
}

let seekSeq=0, srcPartId=null;
// ===== 音源の取り違え防止(重要) =====
// iOSは <audio> の .src を差し替えても .load() しないと前パートの音源が残ることがある。
// すると表示はEなのに AU にはCの音源が載ったまま→trySeekがCをEのタイムにシークし、
// 「Part Eを表示しながらPart Cの会話が鳴る」パート間ズレになる。ここで必ず今のPARTの音源を載せる。
function ensureAudioSource(){
  if(!PART) return false;
  const nsrc=partAudio(PART);
  const ok = srcPartId===PART.id && AU.currentSrc && AU.currentSrc.indexOf(nsrc)>=0
             && (isNaN(AU.duration) || Math.abs(AU.duration-PART.total)<3);   // ★readyStateは条件に入れない: 正しい音源をロード中(readyState<1)にタップすると誤って再ロードし、進行中の読込を捨てて無音になる(連打で永久に鳴らない)。成熟待ちはplayCard側のsrcReady()ゲートに委ねる
  if(ok) return false;                          // 既に正しい音源が載っている(尺未確定=ロード中も、URL/パート一致なら再ロードしない)
  try{AU.pause();}catch(e){}                     // ★差し替え前に必ず止める: iOSは.load()するまで旧音源(前パート/別の話)が鳴り続けることがあり、Part E表示中に別パートの音声が漏れる原因になる
  AU.src=nsrc; AU.load(); srcPartId=PART.id;     // 別パート/未ロード→確実に差し替えてロード
  return true;                                   // 差し替えた(currentTimeは0に戻る)
}
// 再生ボタン: 停止中に押されたら、音声位置が今のカードの範囲外(リロード直後は0秒=先頭)なら頭出しし直してから鳴らす。
// iOSはこのタップが初めての操作なので、ここで初めて読み込み・シークが効く。カード内での一時停止からの再開は位置を触らない。
function togglePlay(){
  if(!AU.paused){AU.pause();return;}
  if(ensureAudioSource()){ playCard(active); return; }   // 音源が別パートだった→正しい音源を載せて頭出し再生(取り違え自己修復)
  const c=CARDS[active];
  if(c && (AU.currentTime<c.start-1 || AU.currentTime>=c.end-0.2)) replay();   // 位置がカード外/終端際=頭出しして再生(replayが強制シーク、失敗はreconcileが補正 Bug2/Bug6)
  else AU.play().catch(()=>{});                                                // カード内での一時停止→続きから再開
}
function trySeek(start){   // seekable範囲が目標をカバーしていれば頭出し。効いたら true
  try{
    const s=AU.seekable;
    if(s&&s.length&&s.end(s.length-1)>=start-0.5){AU.currentTime=start;return AU.currentTime>=start-1;}
    if(AU.readyState>=1){AU.currentTime=start;return AU.currentTime>=start-1;}
  }catch(e){}
  return false;
}
function playCard(i, noPlay){const c=CARDS[i];if(!c)return;
  // 済みは「再生」でなく「話すモードで100点」で付ける(renderSpkResult側)。ここでは記録しない
  const start=c.start+0.02, my=++seekSeq;
  // 各パートの1問目は先頭に約15〜22秒のイントロがあり、card開始は0秒でない。ここへ頭出しする
  const run=()=>{if(my!==seekSeq)return;
    if(!srcReady()){AU.addEventListener('loadedmetadata',run,{once:true});return;}   // ★正しいパートの音源がまだ載っていない→ロード後に鳴らす(旧音源では絶対に鳴らさない=パート間音ズレ根絶)
    if(AU.currentTime<start-0.35 || AU.currentTime>=c.end) trySeek(start);   // 既にこのカード内で鳴っていれば頭出ししない(境界の巻き戻し/二度鳴り防止 Bug1a)
    try{AU.playbackRate=speed;AU.defaultPlaybackRate=speed;}catch(e){}        // 速度はロード後に適用(iOSがsrc差替時1.0xへ戻すため Bug5)
    if(noPlay){AU.pause();} else {AU.play().catch(()=>{const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PLAY;document.getElementById('wave'+active)?.classList.remove('on');});}};   // 再生拒否(iOS初回等)は▶表示に戻すと同時に波形も消す(▶なのに波形が動く不整合を防ぐ)
  if(srcReady())run(); else AU.addEventListener('loadedmetadata',run,{once:true});   // ★readyState>=1だけを信用しない(旧音源がreadyState>=1で居残るiOS対策)
  // iOS対策: メタデータ後もseekableが0のことがあり頭出しが無視される→0秒(イントロ)から鳴って画面とズレる。
  // 目標より手前で鳴っていたら、seekableが広がるまで数回リトライ(前進中の正常再生には触れない)
  let tries=0;
  const fix=()=>{if(my!==seekSeq)return; if(srcReady() && AU.currentTime<start-2)trySeek(start); if(++tries<12)setTimeout(fix,250);};   // 旧音源にはシークしない
  setTimeout(fix,200);
  document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));if(!noPlay)document.getElementById('wave'+i)?.classList.add('on');
  if(noPlay){const b=document.getElementById('play'+i);if(b)b.innerHTML=IC_PLAY;}   // 復元時は自動再生せず▶(停止中)表示。1タップで頭出し位置から鳴る
  revealed[i]=revealed[i]||false;paintText(i);updateEye();}
function goCard(i){if(i<0||i>=CARDS.length)return;const f=document.getElementById('feed'),el=f.querySelector('.card[data-i="'+i+'"]');if(el)f.scrollTo({top:el.offsetTop,behavior:'smooth'});}  // 対象カードのoffsetTopへ
function stepCard(delta){   // ロック画面/イヤホンの 戻る・進む = パート内の問題番号を1つ送る。パートは跨がない
  if(!CARDS.length) return;
  const i=active+delta;
  if(i<0 || i>=CARDS.length) return;   // パートの範囲内に留める(番号送り)
  active=i; lastSwipe=Date.now();
  goCard(i);      // 画面が見えていればスクロールも合わせる(activeは先に更新済なのでonscrollは二重再生しない)
  playCard(i);    // ★ロック中はscrollイベントが来ないので、スクロールに頼らず直接頭出し再生する(ロック中も番号送りが効く)
  saveState();
}
function goNextPart(){const np=(partIdx+1)<DATA.parts.length?partIdx+1:0;openPart(np,0);}  // パート末→次パート(Eの次はAに戻る)
function goPrevPart(){const pp=(partIdx-1+DATA.parts.length)%DATA.parts.length;const last=DATA.parts[pp].chapters.filter(c=>!c.tail).length-1;openPart(pp,Math.max(0,last));}  // パート頭→前パートの最終カードへ(Aの前はEへ)
function replay(){const c=CARDS[active];if(!c)return;lastSwipe=Date.now();if(ensureAudioSource()){playCard(active);return;}trySeek(c.start+0.02);AU.play().catch(()=>{});}  // 頭からもう一回(音源が別パートなら載せ直してから。seek安全化・失敗はreconcileが補正 Bug6)

// ===== 音声の位置を正として、表示(active/本文/スクロール)をそこへ追従させる =====
// 旧: 自動送りが goCard(スクロール)経由でactiveを更新→背景/ロック中はscrollイベントが止まり表示が固まって音声とズレた。
function audioCardOf(t){ for(let i=0;i<CARDS.length;i++){ if(t>=CARDS[i].start-0.05 && t<CARDS[i].end) return i; } return -1; }
function followAudioToCard(i){   // 表示だけ音声のカードへ合わせる(seekしない=音声はもうそこに居る)
  active=i;
  document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));
  if(!AU.paused)document.getElementById('wave'+i)?.classList.add('on');
  revealed[i]=revealed[i]||false; paintText(i); updateEye();
  const f=document.getElementById('feed'), el=f.querySelector('.card[data-i="'+i+'"]');
  if(el && Math.abs(f.scrollTop-el.offsetTop)>10) f.scrollTo({top:el.offsetTop,behavior:'smooth'});
  document.getElementById('hint')?.classList.add('hide'); saveState();
}
// ★取り違え検知: 今のパートの音源(=尺)と、実際に載っている音声の尺が食い違っていたら別パートの音源が載っている
function srcWrong(){ return !!PART && !isNaN(AU.duration) && AU.duration>0 && Math.abs(AU.duration - PART.total) > 3; }
function srcReady(){ return !!PART && AU.currentSrc && AU.currentSrc.indexOf(partAudio(PART))>=0 && AU.readyState>=1 && !srcWrong(); }  // 今のパートの音源が本当に載って再生可能か(readyStateだけでなくURL・尺も一致)
function reconcile(){   // 表示カードと鳴っている音声がズレていたら合わせる(自動送り/背景復帰/シーク失敗を自己修復)
  if(!CARDS.length) return;
  if(srcWrong()){                                  // ★パート間の音ズレ根絶: 別パートの音源が載っていたら switching中でも必ず即是正(切替中の自動送り・画面ロック中も封じない)
    const wasPlaying=!AU.paused; try{AU.pause();}catch(e){}
    ensureAudioSource();                            // 今のPARTの音源を確実にロードし直す
    if(wasPlaying) playCard(active);                // 鳴っていたなら正しい音源が載り次第、頭出しから鳴らし直す(playCardのゲートで旧音源は鳴らさない)
    return;
  }
  if(switching || AU.paused) return;
  const c=CARDS[active], ac=audioCardOf(AU.currentTime);
  if(Date.now()-lastSwipe < 1200){ if(c && ac!==active) trySeek(c.start+0.02); return; }  // 直近スワイプ直後は表示を正=音声を合わせる(イントロ0秒でも)
  if(c && !repeat && AU.currentTime >= c.end - 0.05){   // ★表示カードの終端に到達(テール領域はac=-1になり下のガードで素通りするため、currentTimeで判定)。リピートON時は終端処理をtimeupdateのreplayに委ね、予備reconcileが終端窓へ先着して誤pause/誤goNextPartするのを防ぐ
    if(!auto){ AU.pause(); return; }                        // 自動送りOFF: 最終カードでも境界で必ず止める(末尾テールを流さない)
    if(active === CARDS.length-1){ goNextPart(); return; }  // 自動送りON最終カード: テールを流さず次パートへ
  }
  if(ac<0 || ac===active) return;
  if(!auto && ac>active){ AU.pause(); return; }                 // 自動送りOFF: 次に進めず現カードで止める
  followAudioToCard(ac);                                        // 通常: 音声を正=表示を追従(スクロールが止まる背景でも復帰時に合う)
}
// ===== リスニング本文を音に合わせて青くなぞる(文/行ごと) =====
let _litSeg=-1, _litCard=-1;   // 直近に自動スクロールしたなぞりセグメント(同じ行で何度もスクロールしない)
function updateHighlight(){
  const el=document.getElementById('text'+active); if(!el)return;
  const segs=el.querySelectorAll('.lseg'); if(!segs.length)return;
  const c=CARDS[active], t=AU.currentTime; let cur=-1;
  if(!AU.paused && c && c.hl && c.hl.length){
    for(let i=0;i<c.hl.length;i++){ const w=c.hl[i].w||[]; if(w.some(x=>t>=x[0] && t<x[1])){cur=i;break;} }
  }
  segs.forEach(s=>s.classList.toggle('lit', (+s.dataset.seg)===cur));   // 今読まれているセグメントだけ青
  if(cur>=0 && (cur!==_litSeg || active!==_litCard)){   // なぞる行が変わった時だけ、本文枠(.text)内で青い行を見える位置へスクロール(#feedのカードスナップは触らない)
    _litSeg=cur; _litCard=active;
    const seg=el.querySelector('.lseg[data-seg="'+cur+'"]');
    if(seg){ const cr=el.getBoundingClientRect(), sr=seg.getBoundingClientRect();
      if(sr.top<cr.top+6 || sr.bottom>cr.bottom-6)   // 枠の外(上/下)に出ていたら
        el.scrollTo({top: el.scrollTop + (sr.top-cr.top) - cr.height*0.32, behavior:'smooth'});   // 枠の上から約1/3の位置へ寄せる
    }
  }
}
AU.addEventListener('timeupdate',()=>{
  const c=CARDS[active];
  if(repeat && c && AU.currentTime>=c.end-0.05){ replay(); return; }   // 1問リピート
  reconcile();
  updateHighlight();
});
AU.addEventListener('ended',()=>{ if(auto) goNextPart(); else AU.pause(); });   // パート音源の終端→次パート(Bug4: timeupdateが末尾閾値に届かず無音停止するのを防ぐ)
setInterval(reconcile, 500);   // 予備: timeupdateが疎な時のズレも拾う
document.addEventListener('visibilitychange',()=>{   // 画面復帰(別アプリから戻る/ロック解除)で表示と音源を合わせ直す
  if(document.hidden) return;
  switching=false;
  setTimeout(()=>{
    if(!CARDS.length) return;
    if(srcWrong()){ reconcile(); return; }                 // 別パートの音源が載っていたらreconcileで是正
    const ac=audioCardOf(AU.currentTime);
    if(ac>=0 && ac!==active) followAudioToCard(ac);         // ★復帰時は再生中でなくても表示を音声の今のカードへ追従(iOSは復帰時に一瞬pausedになりreconcileが空振りするため)
    reconcile();
  }, 80);
});
function setPlaybackState(s){ if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState=s; }catch(e){} } }   // ★連続再生: iOSに「今再生中」を伝え、パート跨ぎでも再生セッションを維持させる
AU.addEventListener('play',()=>{document.getElementById('wave'+active)?.classList.add('on');const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PAUSE;document.getElementById('hint')?.classList.add('hide');setPlaybackState('playing');reqWake();});
AU.addEventListener('pause',()=>{document.getElementById('wave'+active)?.classList.remove('on');const b=document.getElementById('play'+active);if(b)b.innerHTML=IC_PLAY;setPlaybackState('paused');updateHighlight();});   // 停止でなぞりを消す

function veilHTML(i){return `<div class="veil" data-rev="${i}">${IC_EYE}<span>${PART.id==='B'?'英文を見る':'答えを見る'}</span></div>`;}
function paintText(i){const c=CARDS[i],el=document.getElementById('text'+i);if(!el)return;
  if(i===active){_litSeg=-1; updateMediaMeta();}   // 表示カードを描き直すと.textのscrollTopが0に戻るので、なぞり自動スクロールの記憶をリセット(次tickで再追従)。ロック画面の問題番号も更新
  if(!revealed[i] && hideAns){el.innerHTML='';updateEye();return;}   // 非表示中は本文を空に。表示は下バーの「答えを見る」で
  document.getElementById('hint')?.classList.add('hide');
  const isDlg=c.dialogue&&c.dialogue.length;
  let h='';
  if(PART.id==='D'&&c.passage){   // Part D: 本文を文ごとのspanに分けて表示(再生中の文を青くなぞる)。太字=答えの手がかり
    const sents=(c.hl&&c.hl.length&&c.hl[0].s)?c.hl.map(x=>x.s):[c.passage];
    const pe=sents.map((s,si)=>`<span class="lseg${c.key_line&&s.trim()===c.key_line.trim()?' key':''}" data-seg="${si}">${s}</span>`).join(' ');
    const py=c.passage_yaku&&c.key_line_yaku&&c.passage_yaku.indexOf(c.key_line_yaku)>=0?c.passage_yaku.split(c.key_line_yaku).join('<b>'+c.key_line_yaku+'</b>'):c.passage_yaku;
    h+=`<div class="pass top"><div class="pk">本文<span>太字が答えの手がかり</span></div><div class="pen">${pe}</div>${py?`<div class="pyaku">${py}</div>`:''}</div>`;
  }
  if(isDlg){   // Part C: 会話(リスニング本文)を先頭に、質問はそのあと(Part Dの本文先頭と同じ並び)
    h+='<div class="dlg first">'+c.dialogue.map((d,di)=>`<div><span>${d.speaker}</span><span class="lseg" data-seg="${di}">${d.text}</span>${d.yaku?`<div class="dy">${d.yaku}</div>`:''}</div>`).join('')+'</div>';   // 訳も発話divの中に入れ、英文と同じ左端(divのpadding-left)にそろえる。台詞はlseg化(再生中の行を青くなぞる)
    if(c.question){h+=`<div class="enlab">${ENLAB[PART.id]||'質問'}</div><div class="en">${c.question}</div>`; if(c.q_yaku)h+=`<div class="yaku">${c.q_yaku}</div>`;} }   // 会話の後の大きな英文が「質問」だと分かるようにラベルを付ける
  else if(c.en){if(ENLAB[PART.id])h+=`<div class="enlab">${ENLAB[PART.id]}</div>`;   // 大きな英文が質問(A/D/F)か・聞いて再話する話(E)か・復唱する英文(B)かを示す
    if(c.kana)h+=`<div class="kana">${c.kana}</div>`;
    const enh=(['A','B','E','F','G'].includes(PART.id)&&c.hl&&c.hl.length&&c.hl[0].s)?c.hl.map((x,si)=>`<span class="lseg" data-seg="${si}">${x.s}</span>`).join(' '):c.en;   // A/B/E/F/G のen(質問・文・例文)を読み上げに合わせてlseg化(青くなぞる)。Dは本文を先頭で別描画するのでここでは除外(二重表示防止)
    h+=`<div class="en">${enh}</div>`; if(c.yaku)h+=`<div class="yaku">${c.yaku}</div>`;}
  if(c.bone&&c.bone.length&&PART.id!=='D'&&PART.id!=='E')h+=`<div class="row"><span class="k">要点</span><span class="v">${c.bone.join(' / ')}</span></div>`;   // Part Eは要点を廃止(最低限とほぼ同義)。Part Fの要点(意見→理由)は残す
  if(c.bone_en&&c.bone_en.length&&PART.id!=='E')h+=`<div class="row"><span class="k">使える単語</span><span class="v">${c.bone_en.join(' / ')}</span></div>`;   // Part Eは使える単語を廃止(最低限回答とイコール)。Part Fの言い出し表現は残す
  if(c.answer_full&&PART.id!=='B'){   // 答えと解答例を統一: 解答例の中の「最低限の答え」を太字に
    let ex=c.answer_full;
    if(c.answer){const li=ex.toLowerCase().indexOf(c.answer.toLowerCase()); if(li>=0)ex=ex.slice(0,li)+'<b>'+ex.slice(li,li+c.answer.length)+'</b>'+ex.slice(li+c.answer.length);}   // 文頭大文字でも太字化(大小無視)
    h+=`<div class="row ex"><span class="k">解答例</span><span class="v">${ex}${(PART.id!=='A'&&(c.a_yaku||c.answer))?`<div class="tip">太字だけでも正解${c.a_yaku?'・'+c.a_yaku:''}</div>`:''}</span></div>`;   // Part Aは答えが元々短いので「太字だけでも正解」は不要
  }else if(c.answer&&PART.id!=='B'){   // 解答例が無い時は答えだけ
    h+=`<div class="row"><span class="k">答え</span><span class="v"><b>${c.answer}</b>${c.a_yaku?'　'+c.a_yaku:''}</span></div>`;
  }
  if(c.target)h+=`<div class="row"><span class="k">解説</span><span class="v"><b>${c.target}</b> → ${c.target_kana||''}${c.kotsu?`<div class="tip">${c.kotsu}</div>`:(c.kind&&TIP[c.kind]?`<div class="tip">${TIP[c.kind]}</div>`:'')}</span></div>`;   // kotsuがあれば「どこを聞くか」を優先表示、無ければ崩れ種別の一言
  else if((c.kotsu||c.memo)&&PART.id!=='D')h+=`<div class="row"><span class="k">手がかり</span><span class="v">${c.kotsu||c.memo}</span></div>`;   // Part C: 難所解説(kotsu)があればそれを手がかりに(答えの位置＋拾う語句)。Part Dは本文の太字が兼ねる
  if(c.crush_spots&&c.crush_spots.length)h+=`<div class="row"><span class="k">消える音</span><span class="v">${c.crush_spots.map(s=>`<b>${s.phrase}</b> → ${s.kana}`).join(' ／ ')}</span></div>`;   // Part C: 会話中の弱形難所(消えやすい語)を一覧
  if(c.retell)h+=`<div class="row"><span class="k">解答例</span><span class="v">${c.retell}${c.retell_yaku?'　'+c.retell_yaku:''}</span></div>`;        // Part E(再話の解答例。他パートと表記統一)
  if(c.retell_min)h+=`<div class="row"><span class="k">最低限</span><span class="v">${c.retell_min}${c.retell_min_yaku?'　'+c.retell_min_yaku:''}</span></div>`;  // Part E: これだけ言えば0点回避
  el.innerHTML=h;
  updateEye();   // 下バーの「答えを見る/隠す」を今の表示状態に合わせる
}


// ロック画面/イヤホンの 戻る・進む = パート内の問題番号送り(もう一回は画面内の⟲ボタン)

  if(!('mediaSession' in navigator) || !PART || !CARDS.length) return;
  try{ navigator.mediaSession.metadata = new MediaMetadata({

    artist: PART.title,

  }); }catch(e){}
}

}

function skEsc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function startSpkRec(fromSheet){
  if(spkRecording||_recStarting) return;   // 二重起動防止(getUserMedia許可待ちの間に再タップ/合成clickが来ても多重に開始しない)
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ skOpen('<div class="sk-status">この端末では録音できません</div>'); return; }
  _recStarting=true;
  try{
    try{AU.pause();}catch(e){}                                   // 聞く音声が録音に混じらないよう止める
    spkStream=await navigator.mediaDevices.getUserMedia({audio:true});
    spkChunks=[]; spkRec=new MediaRecorder(spkStream);
    spkRec.ondataavailable=e=>{ if(e.data.size) spkChunks.push(e.data); };
    spkRec.onstop=async ()=>{
      try{ spkStream.getTracks().forEach(t=>t.stop()); }catch(e){}
      if(_recCancel){ _recCancel=false; return; }   // 再生等で割り込み→採点せず終了
      const ref=(CARDS[active]&&CARDS[active].en)||''; spkLastRef=ref;
      if(!spkChunks.length||!ref||(Date.now()-_recStart)<SPK_MIN_MS){ skClose(); return; }   // 誤タップ(0.5秒未満)は採点しない
      spkLastBlob=new Blob(spkChunks,{type:(spkChunks[0]&&spkChunks[0].type)||'audio/mp4'});   // 聞き返し用(即・お手本/自分の声ボタンをすぐ使える)
      renderSpkPending(ref);   // 先に画面(英文・ボタン)を即表示。採点が要る所だけ後で埋める
      try{
        const b64=await blobToB64(spkLastBlob);   // 変換せず"そのまま"の音声を送る(粗い16kHzリサンプルをやめ認識精度を上げる)
        await scoreSpk(b64, ref, spkLastBlob.type);
      }catch(e){ skOpen('<div class="sk-status">音声の処理に失敗しました</div>'); }
    };
    spkRec.start(); spkRecording=true; _recStart=Date.now();
    clearTimeout(_maxRecTimer); _maxRecTimer=setTimeout(()=>{ if(spkRecording) stopSpkRec(); }, SPK_MAX_MS);   // 止め忘れ対策: 最長で自動停止→採点
    document.querySelectorAll('[data-mic]').forEach(m=>m.classList.add('rec'));   // マイクボタンが赤く点滅＋真上に「録音中…」ラベル(.miclbl)。シート内録音時はシートが覆うので裏のラベルは見えない
  }catch(e){ document.querySelectorAll('[data-mic]').forEach(m=>m.classList.remove('rec')); skOpen('<div class="sk-status">マイクを使えませんでした（許可を確認してください）</div>'); }
  finally{ _recStarting=false; }
}
function stopSpkRec(cancel){
  if(!spkRecording) return;
  if((Date.now()-_recStart) < 400) return;   // 開始直後(0.4秒未満)の停止要求は二重タップ/合成clickの誤爆とみなし無視(=「一瞬録音中で終わって機能しない」対策)。20秒の自動停止は400ms超なので影響なし
  spkRecording=false; _recCancel=!!cancel;   // cancel=採点せず中断(再生等で割り込み時)
  clearTimeout(_maxRecTimer);
  document.querySelectorAll('[data-mic]').forEach(m=>m.classList.remove('rec'));
  try{ if(spkRec&&spkRec.state!=='inactive') spkRec.stop(); }catch(e){}
}
// タップで録音開始 / もう一度タップで停止して採点(カードのclickハンドラから呼ばれる)
function toggleSpkRec(){ if(spkRecording) stopSpkRec(); else startSpkRec(); }
document.getElementById('spkrX').addEventListener('click',skClose);
document.getElementById('spkrBg').addEventListener('click',skClose);
// 結果シート内の操作: 語タップで読み上げ / 自分の声・お手本を再生 / もう一度言う
function skSpeak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.9; const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang)); if(v)u.voice=v; speechSynthesis.speak(u); }catch(e){} }
function skPlayMine(){ if(!spkLastBlob) return; try{ if(_modelAudio)_modelAudio.pause(); if(_mineAudio) _mineAudio.pause(); _mineAudio=new Audio(URL.createObjectURL(spkLastBlob)); _mineAudio.play().catch(()=>{}); }catch(e){} }
// お手本は「録音前に聞いたのと同じ実音声」＝メイン音声(AU, partB.mp3等)の該当文だけを鳴らす(合成音声にしない=声が変わらない)
let _modelStop=0;
function skPlayModel(){
  const c=CARDS[active]; if(!c){ skSpeak(spkLastRef); return; }
  try{ if(_mineAudio)_mineAudio.pause(); }catch(e){}
  try{ ensureAudioSource(); }catch(e){}                                        // AUに正しいパート音源を確実に載せる(既存の音ズレ対策)
  const start=(c.start||0)+0.03, dur=Math.min(8,((spkLastRef||'').split(/\s+/).filter(Boolean).length||3)*0.42+0.6);
  try{ AU.currentTime=start; }catch(e){}
  AU.play().catch(()=>{});
  clearTimeout(_modelStop); _modelStop=setTimeout(()=>{ try{AU.pause();}catch(e){} }, dur*1000+300);   // 文の分だけ鳴らして停止(以降のゆっくり/積み上げは流さない)
}
_spkrBody.addEventListener('click',e=>{
  const a=e.target.closest('[data-sk]');
  if(spkRecording){ if(a&&a.dataset.sk==='again') stopSpkRec(); return; }                  // 録音中は「停止」だけ有効(他は無効=音が混ざらない)
  const w=e.target.closest('.w'); if(w){ skSpeak(w.textContent); return; }                 // 語タップ=その語を読み上げ(単語ヘルパー)
  if(!a) return;
  if(a.dataset.sk==='mine') skPlayMine();                                                  // 自分の声
  else if(a.dataset.sk==='model') skPlayModel();                                            // お手本=カードと同じ実音声
  else if(a.dataset.sk==='again'){ startSpkRec(true); a.textContent='録音中… タップで停止'; a.classList.add('sk-recing'); }   // 閉じずにその場で録音(文を見ながら)
});

// 録音blob(iOSはmp4等)→ 16kHz mono PCM16 WAV → base64
async function blobToWav16k(blob){
  const buf=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
  const audio=await ac.decodeAudioData(buf);
  const len=audio.length, ch=audio.numberOfChannels;
  let mono=new Float32Array(len);
  for(let c=0;c<ch;c++){ const d=audio.getChannelData(c); for(let i=0;i<len;i++) mono[i]+=d[i]/ch; }
  const src=audio.sampleRate, dst=16000, outLen=Math.max(1,Math.round(len*dst/src));
  const out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++){ const t=i*src/dst, i0=Math.floor(t), i1=Math.min(i0+1,len-1), f=t-i0; out[i]=mono[i0]*(1-f)+mono[i1]*f; }
  try{ ac.close(); }catch(e){}
  return skB64(encodeWav(out,dst));
}
function encodeWav(samples,rate){
  const n=samples.length, b=new ArrayBuffer(44+n*2), v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  let o=44; for(let i=0;i<n;i++){ let s=Math.max(-1,Math.min(1,samples[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
  return b;
}
function skB64(ab){ const by=new Uint8Array(ab); let s=''; for(let i=0;i<by.length;i+=0x8000) s+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000)); return btoa(s); }

async function blobToB64(blob){ return skB64(await blob.arrayBuffer()); }   // 元の音声をそのままbase64化(変換なし)
async function scoreSpk(audioB64, reference, mime){
  try{
    const r=await fetch(SPEAK_API+'/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:audioB64,reference,mime})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'採点に失敗');
    renderSpkResult(j);
  }catch(e){ skOpen('<div class="sk-status">採点サーバーに接続できませんでした</div>'); }
}
// 録音直後の"下地"表示: 英文とボタンを即出し、評価とアドバイスだけ後で埋める(体感を速く)
function renderSpkPending(ref){
  const wHTML=(ref||'').split(/\s+/).filter(Boolean).map(w=>`<span class="w">${skEsc(w)}</span>`).join(' ');
  skOpen(
    `<div class="sk-verdict"><span class="sk-load">採点中…</span></div>`
    +`<div class="sk-words">${wHTML}</div>`
    +`<div class="sk-leg"><span class="sk-tap">語をタップで読み上げ</span></div>`
    +`<div class="sk-adv"><span class="k">アドバイス</span><span class="sk-load">考え中…</span></div>`
    +`<div class="sk-actions">`
      +`<button class="sk-btn" data-sk="model">お手本を聞く</button>`
      +`<button class="sk-btn" data-sk="mine">自分の声を聞く</button>`
      +`<button class="sk-btn sk-again" data-sk="again">もう一度言う</button>`
    +`</div>`
  );
}
const SK_FUNC=new Set('a an the to of in on at for and or but is am are was were be been do does did have has had will would shall can could i he she it we they you your my me this that with as so no not'.split(' '));
function renderSpkResult(j){
  const said=Math.round((j.scores&&j.scores.said)??0);
  try{ logScore(PART&&PART.id, said); }catch(e){}   // 言えた率を記録(将来「一文ごとの前回%」等に使う)
  if(said>=100 && PART){ try{ logDone(PART.id, active); if(document.getElementById('home')&&!document.getElementById('home').classList.contains('off')) renderHome(); }catch(e){} }   // 話すモードで100点=その問題を「済み」に
  const words=j.words||[];
  const bad=w=>!w.ok && !SK_FUNC.has(w.word.toLowerCase().replace(/[^a-z']/g,''));   // 短い機能語(to/a/the等)は赤にしない=誤解を減らす
  const wHTML=words.map(w=>`<span class="w ${bad(w)?'bad':''}">${skEsc(w.word)}</span>`).join(' ');
  const hasBad=words.some(bad);
  const verdict= said>=80?'よく言えています' : said>=55?'おしい、あと少し' : 'もう一度言ってみよう';
  skOpen(
    `<div class="sk-verdict">${verdict}<span>言えた率 ${said}%</span></div>`
    +`<div class="sk-words">${wHTML}</div>`
    +`<div class="sk-leg"><span class="sk-tap">語をタップで読み上げ</span>${hasBad?'（赤 ＝ 直したい所）':''}</div>`
    +`<div class="sk-adv"><span class="k">アドバイス</span>${skEsc(j.advice||'')}</div>`
    +`<div class="sk-actions">`
      +`<button class="sk-btn" data-sk="model">お手本を聞く</button>`
      +`<button class="sk-btn" data-sk="mine">自分の声を聞く</button>`
      +`<button class="sk-btn sk-again" data-sk="again">もう一度言う</button>`
    +`</div>`
  );
}
