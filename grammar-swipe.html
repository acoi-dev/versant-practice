<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イメージ英文法</title>
<style>
  :root{
    /* 端の余白。ブラウザは env() がそのまま効く。アプリ(WKWebView)は env() が常に0を返すので、
       Flutter 側が実測値で上書きする(main.dart の _applyInsets) */
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
    --bg:#ffffff; --ink:#14161a; --muted:#5f6773;
    --line:#edeff2; --line2:#c4cad3; --accent:#2f6df6; --accent-soft:#eaf1ff;
    --maxw:760px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1113; --ink:#eef0f2; --muted:#9aa2ad;
      --line:#20242a; --line2:#3a4048; --accent:#6b9bff; --accent-soft:#18202e; }
  }
  :root[data-theme="dark"]{ --bg:#0f1113; --ink:#eef0f2; --muted:#9aa2ad;
    --line:#20242a; --line2:#3a4048; --accent:#6b9bff; --accent-soft:#18202e; }
  :root[data-theme="light"]{ --bg:#ffffff; --ink:#14161a; --muted:#5f6773;
    --line:#edeff2; --line2:#c4cad3; --accent:#2f6df6; --accent-soft:#eaf1ff; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"SF Pro Text",system-ui,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    line-height:1.75;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

  header{padding:78px 0 30px}
  .eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{font-size:clamp(30px,7vw,46px);line-height:1.18;letter-spacing:-.02em;margin:16px 0 0;text-wrap:balance;font-weight:800}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{font-size:17px;color:var(--muted);margin:20px 0 0;max-width:60ch}

  .intro{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:30px 0;margin:36px 0 8px}
  .intro p{margin:0 0 14px;font-size:16px}
  .intro p:last-child{margin-bottom:0}
  .intro b{color:var(--ink);font-weight:700}

  .group{margin:54px 0 0}
  .group-h{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
  .group-n{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
  .group-t{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .group-d{color:var(--muted);font-size:14.5px;margin:0 0 20px}

  .card{border:1px solid var(--line);border-radius:16px;padding:24px 22px;margin:16px 0}
  .dia{width:100%;max-width:330px;height:auto;display:block;margin:2px auto 18px}
  .word{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .word .en{font-size:30px;font-weight:800;letter-spacing:-.01em}
  .word .jp{font-size:14px;color:var(--muted);font-weight:600}
  .img-line{font-size:17px;font-weight:700;margin:10px 0 0}
  .img-line .hi{color:var(--accent)}
  .desc{font-size:15.5px;color:var(--muted);margin:8px 0 0}
  .ex{margin:16px 0 0;padding:12px 16px;border-left:3px solid var(--line2);background:transparent}
  .ex .s{font-size:16px;font-weight:600}
  .ex .s u{text-decoration:none;color:var(--accent);border-bottom:2px solid var(--accent)}
  .ex .t{font-size:14px;color:var(--muted);margin-top:2px}

  .vs{border:1px solid var(--line2);border-radius:14px;padding:20px 22px;margin:20px 0}
  .vs-h{font-size:14px;font-weight:700;color:var(--accent);margin:0 0 12px;letter-spacing:.02em}
  .vs-row{display:flex;gap:14px;flex-wrap:wrap}
  .vs-col{flex:1 1 220px}
  .vs-col .k{font-weight:800;font-size:15px}
  .vs-col .v{font-size:14.5px;color:var(--muted);margin-top:3px}
  .vs-col .v em{font-style:normal;color:var(--ink);font-weight:600}

  .close{margin:64px 0 0;border-top:1px solid var(--line);padding:34px 0 0}
  .close h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
  .close p{font-size:16px;margin:0 0 14px;color:var(--ink)}
  .close .step{display:flex;gap:12px;align-items:flex-start;margin:12px 0;color:var(--muted);font-size:15.5px}
  .close .step b{color:var(--ink)}
  .close .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink);margin-top:3px}

  .src{margin:52px 0 90px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
  .src a{color:var(--accent);text-decoration:none}
  .src a:hover{text-decoration:underline}

  /* 腕試し(空欄うめクイズ) */
  .quiz{margin:60px 0 0;border-top:1px solid var(--line);padding:34px 0 0}
  #quizBody{margin-top:6px}
  .qprog{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;margin:0 0 12px}
  .qscore{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 18px}
  .qscore b{color:var(--accent)}
  .qgroup{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:30px 0 12px}
  .qnum{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:0 0 9px}
  .qcard{border:1px solid var(--line2);border-radius:14px;padding:22px;margin:0 0 14px}
  .qsent{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.55}
  .qblank{display:inline-block;min-width:2.6em;text-align:center;color:var(--accent);border-bottom:2px solid var(--accent);line-height:1}
  .qjp{font-size:14px;color:var(--muted);margin:11px 0 0}
  .qopts{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
  .qopt{border:1px solid var(--line2);border-radius:10px;padding:11px 20px;font-size:16px;font-weight:700;color:var(--ink);background:none;cursor:pointer;font-family:inherit;transition:border-color .12s,color .12s}
  .qopt:hover:not(:disabled){border-color:var(--accent)}
  .qopt:disabled{cursor:default}
  .qopt.ok{border-color:var(--accent);color:var(--accent)}
  .qopt.ng{border-color:#e5484d;color:#e5484d}
  .qfb{margin:18px 0 0;font-size:15px;line-height:1.7;display:none}
  .qfb.show{display:block}
  .qfb .v{font-weight:800}
  .qfb .v.ok{color:var(--accent)}
  .qfb .v.ng{color:#e5484d}
  .qfb .e{color:var(--ink);margin-top:4px}
  .qdia{margin:14px 0 2px;display:flex;justify-content:center}
  .qdia svg{max-width:180px;height:auto}
  .qnext{margin:20px 0 0;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit}
  .qnext:active{opacity:.85}
  .qend{border:1px solid var(--line2);border-radius:14px;padding:30px 22px;text-align:center}
  .qend .sc{font-size:34px;font-weight:800;letter-spacing:-.01em}
  .qend .sc b{color:var(--accent)}
  .qend .msg{color:var(--muted);font-size:15px;margin:8px 0 22px;line-height:1.7}
  .qend .again{border:1px solid var(--line2);background:none;color:var(--ink);font-weight:700;font-size:15px;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit}
  .qend .again:active{background:var(--line)}

  /* SVG共通 */
  .s-line{stroke:var(--line2);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .s-faint{stroke:var(--line);stroke-width:1.5;fill:none}
  .s-acc{stroke:var(--accent);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .s-acc-d{stroke:var(--line2);stroke-width:2;fill:none;stroke-dasharray:5 6;stroke-linecap:round}
  .f-acc{fill:var(--accent)}
  .f-bg{fill:var(--bg)}
  .f-dot{fill:var(--line2)}
  .t-lbl{fill:var(--muted);font-size:12px;font-weight:600;
    font-family:-apple-system,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
  .t-acc{fill:var(--accent);font-size:12px;font-weight:700;
    font-family:-apple-system,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}

  @media (min-width:620px){
    .card{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:center;padding:26px}
    .dia{margin:0}
    .card-body{min-width:0}
  }

  /* アプリと同一トークンに合わせる */
  :root{ --ink:#14151a; --sub:#6b7078; --muted:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd; --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5 }
  @media (prefers-color-scheme:dark){ :root{ --ink:#e9ebf0; --sub:#8b9099; --muted:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f; --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20 } }
  :root[data-theme="dark"]{ --ink:#e9ebf0; --sub:#8b9099; --muted:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f; --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20 }
  :root[data-theme="light"]{ --ink:#14151a; --sub:#6b7078; --muted:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd; --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5 }
  html,body{height:100%}
  body{overflow:hidden;font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif}
  /* アプリと同じchrome */
  .head{position:fixed;top:calc(var(--sat) + 12px);left:0;right:0;padding:0 64px;display:flex;justify-content:center;align-items:center;z-index:20}
  .htitle{text-align:center;font-size:13px;color:var(--ink);font-weight:600}
  .topgear{position:fixed;top:calc(var(--sat) + 10px);right:16px;z-index:22;border:1px solid var(--line2);background:var(--bg);color:var(--sub);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .topgear svg{width:22px;height:22px;display:block}
  .lnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 20px calc(var(--sab) + 12px);background:var(--bg)}
  .lnav .home{grid-column:3;justify-self:end;width:46px;height:46px;padding:0;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .lnav .home:active{background:var(--hover)}
  .lnav .home svg{width:20px;height:20px;display:block}
  .lpop{position:fixed;top:calc(var(--sat) + 56px);right:16px;z-index:23;width:min(260px,80vw);border:1px solid var(--line2);background:var(--bg);border-radius:14px;padding:15px 17px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.15s;font-size:13px;color:var(--sub);line-height:1.75}
  .lpop.on{opacity:1;transform:none;pointer-events:auto}
  .lpop a{color:var(--accent);text-decoration:none}
  #feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #feed::-webkit-scrollbar{display:none}
  .scard{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;padding:64px 24px 84px}
  .plabel{position:absolute;top:calc(var(--sat) + 14px);left:24px;font-size:12.5px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
  .sc-in{width:100%;max-width:460px;text-align:center}
  .sdia{margin:0 auto 8px;max-width:330px}
  .sdia svg{width:100%;height:auto}
  .sword{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-top:4px}
  .sword .en{font-size:42px;font-weight:800;letter-spacing:-.01em}
  .sword .role{font-size:14px;color:var(--muted);font-weight:600}
  .simg{font-size:18px;font-weight:700;margin:12px 0 0}
  .sex{margin:22px auto 0;max-width:380px}
  .sex .s{font-size:18px;font-weight:600}
  .sex .s .hl{color:var(--accent);font-weight:800}
  .sex .t{font-size:14px;color:var(--muted);margin-top:4px}
  .shint{position:absolute;bottom:calc(var(--sab) + 78px);left:0;right:0;text-align:center;color:var(--muted);font-size:13px;font-weight:600;animation:bob 1.8s ease-in-out infinite}
  .div .dnum{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin:0 0 14px}
  .div .dttl{font-size:46px;font-weight:800;letter-spacing:-.02em}
  .div .dsub{font-size:17px;color:var(--muted);margin:12px 0 0;font-weight:600}
  .qtag{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin:0 0 14px}
  .qs{font-size:24px;font-weight:800;line-height:1.5;letter-spacing:-.01em}
  .qbk{display:inline-block;width:1.9em;border-bottom:2.5px solid var(--accent);margin:0 6px;vertical-align:1px}
  .qj{font-size:14px;color:var(--muted);margin:12px 0 0}
  .qo{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:24px 0 0}
  .qb{border:1px solid var(--line2);background:none;color:var(--ink);font-family:inherit;font-weight:800;font-size:18px;padding:12px 22px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .qb.ok{border-color:var(--accent);color:var(--accent)}
  .qb.ng{border-color:#e5484d;color:#e5484d}
  .qf{margin:22px 0 0;display:none}
  .qf.show{display:block}
  .qf .v{font-weight:800;font-size:16px}
  .qf .v.ok{color:var(--accent)} .qf .v.ng{color:#e5484d}
  .qf .e{font-size:15px;color:var(--ink);margin-top:6px;line-height:1.7}
  .qf .qd{margin:12px auto 0;max-width:170px}
  .qf .qd svg{width:100%;height:auto}
  .res .num{font-size:40px;font-weight:800;letter-spacing:-.02em}
  .res .num b{color:var(--accent)}
  .res .msg{color:var(--muted);font-size:15px;margin:8px 0 0;line-height:1.7}
</style></head><body>
<div class="head"><div class="htitle">イメージ英文法</div></div>
<button class="topgear" id="lgear" aria-label="この教材について"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div class="lpop" id="lpop">前置詞・冠詞などを“絵（イメージ）”で覚える教材です。<br>出典: YouTube「サイモンのイキれる英語教室」のコアイメージ解説にインスパイア。</div>
<div id="feed"></div>
<nav class="lnav"><button class="home" id="lhome" aria-label="一覧にもどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button></nav>

var SUB={"prepositions": "空間・方向・つながりを“絵”で", "basic-verbs": "get・take・put の“絵”", "see-look-watch": "3つの「見る」の違い", "phrasal-verbs": "動詞にくっつく粒子の“絵”", "a-the": "どれか1つ／特定の1つ", "to-ing": "これから／進行中", "causatives": "させる力の強さ", "possessive": "'s と of"};
var feed=document.getElementById('feed');
function esc(s){return (s==null?'':String(s));}
function plab(n){return '<div class="plabel"><b>'+n+'</b> / '+TOTAL+'</div>';}
function conceptCard(c,n){
  var ex=c.ex.replace(new RegExp('\\b'+c.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'), '<span class="hl">'+c.en+'</span>');
  return '<section class="scard">'+plab(n)+'<div class="sc-in">'+
    '<div class="sdia">'+(c.dia||'')+'</div>'+
    '<div class="sword"><span class="en">'+esc(c.en)+'</span>'+(c.role?'<span class="role">'+esc(c.role)+'</span>':'')+'</div>'+
    '<p class="simg">'+esc(c.image)+'</p>'+
    '<div class="sex"><div class="s">'+ex+'</div><div class="t">'+esc(c.exj)+'</div></div>'+
    '</div></section>';
}
function dividerCard(t,ti,n,first){
  return '<section class="scard div">'+plab(n)+'<div class="sc-in">'+
    '<div class="dnum">TOPIC '+(ti+1)+' / '+TOPICS.length+'</div>'+
    '<div class="dttl">'+esc(t.label)+'</div>'+
    '<div class="dsub">'+esc(SUB[t.id]||'')+'</div>'+
    '</div>'+(first?'<div class="shint">↑ 上にスワイプ</div>':'')+'</section>';
}
function quizCard(q,idx,total,ti,n){
  var opts=q.options.map(function(o){return '<button class="qb" data-o="'+esc(o)+'">'+esc(o)+'</button>';}).join('');
  return '<section class="scard" data-quiz="1" data-topic="'+ti+'" data-idx="'+idx+'">'+plab(n)+'<div class="sc-in">'+
    '<div class="qtag">腕試し '+(idx+1)+' / '+total+'</div>'+
    '<div class="qs">'+esc(q.pre)+'<span class="qbk">&nbsp;</span>'+esc(q.post)+'</div>'+
    '<div class="qj">'+esc(q.jp)+'</div>'+
    '<div class="qo">'+opts+'</div>'+
    '<div class="qf"></div>'+
    '</div></section>';
}
function resultCard(t,ti,n){
  return '<section class="scard res">'+plab(n)+'<div class="sc-in"><div class="num" id="res'+ti+'"><b>0</b> / '+t.quiz.length+'</div><div class="msg">'+esc(t.label)+'クイズ おつかれさま</div></div></section>';
}
function finalCard(n){
  return '<section class="scard div">'+plab(n)+'<div class="sc-in"><div class="dnum">DONE</div><div class="dttl">おつかれさま！</div><div class="dsub">8トピック、絵で入りましたね</div></div></section>';
}
var items=[];
TOPICS.forEach(function(t,ti){
  items.push({k:'div',t:t,ti:ti});
  t.concepts.forEach(function(c){items.push({k:'con',c:c});});
  t.quiz.forEach(function(q,qi){items.push({k:'q',q:q,qi:qi,total:t.quiz.length,ti:ti});});
  items.push({k:'res',t:t,ti:ti});
});
items.push({k:'fin'});
var TOTAL=items.length;
var scores=TOPICS.map(function(){return {c:0};});
var html='';
items.forEach(function(it,i){ var n=i+1;
  if(it.k==='div') html+=dividerCard(it.t,it.ti,n,i===0);
  else if(it.k==='con') html+=conceptCard(it.c,n);
  else if(it.k==='q') html+=quizCard(it.q,it.qi,it.total,it.ti,n);
  else if(it.k==='res') html+=resultCard(it.t,it.ti,n);
  else html+=finalCard(n);
});
feed.innerHTML=html;
feed.querySelectorAll('.scard[data-quiz]').forEach(function(card){
  var ti=+card.dataset.topic, idx=+card.dataset.idx, q=TOPICS[ti].quiz[idx];
  card.querySelectorAll('.qb').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(card.getAttribute('data-done'))return; card.setAttribute('data-done','1');
      var chosen=btn.dataset.o, isC=(chosen===q.answer); if(isC)scores[ti].c++;
      card.querySelectorAll('.qb').forEach(function(x){x.disabled=true; if(x.dataset.o===q.answer)x.classList.add('ok'); if(x.dataset.o===chosen&&!isC)x.classList.add('ng');});
      var f=card.querySelector('.qf');
      f.innerHTML=(isC?'<span class="v ok">正解！</span>':'<span class="v ng">おしい、正解は '+esc(q.answer)+'</span>')+'<div class="e">'+esc(q.explain)+'</div>'+(q.dia?'<div class="qd">'+q.dia+'</div>':'');
      f.classList.add('show');
      var r=document.getElementById('res'+ti); if(r)r.innerHTML='<b>'+scores[ti].c+'</b> / '+TOPICS[ti].quiz.length;
    });
  });
});
document.getElementById('lhome').addEventListener('click',function(){
  if(window.parent && window.parent!==window && window.parent.closeLesson){ window.parent.closeLesson(); }
  else { history.back(); }
});
var lpop=document.getElementById('lpop');
document.getElementById('lgear').addEventListener('click',function(e){ e.stopPropagation(); lpop.classList.toggle('on'); });
document.addEventListener('click',function(){ lpop.classList.remove('on'); });
</script>
