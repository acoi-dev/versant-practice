<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Versant 話すモード</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14151a; --sub:#6b7078; --faint:#b9bcc2; --line:#eaebee; --line2:#d6d8dd;
    --accent:#1f4fd8; --bg:#fbfbfc; --hover:#f2f3f5;
    --ok:#1f8a4c; --warn:#b06a00; --bad:#c0392b;   /* 語ごとの判定色(塗りでなく文字色+下線に使う) */
    --ui:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e9ebf0; --sub:#8b9099; --faint:#4b4f59; --line:#22242c; --line2:#33363f;
           --accent:#8aa6ff; --bg:#0f1013; --hover:#191b20;
           --ok:#4cc47f; --warn:#e0a24a; --bad:#e8776b; }
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg)}
  body{font-family:var(--ui);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
    font-feature-settings:"palt" 1;display:flex;flex-direction:column;min-height:100dvh}
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 40px);flex:1;display:flex;flex-direction:column}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  .brand{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .back{font-size:13px;color:var(--sub);text-decoration:none;border:1px solid var(--line2);border-radius:9px;padding:5px 11px}
  .sub{font-size:12.5px;color:var(--sub);margin-bottom:20px}
  .prog{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.03em}

  /* 出題カード(罫線のみ・塗りなし) */
  .card{border:1px solid var(--line2);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
  .leadrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .lead{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);font-weight:600}
  .en{font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1.45}
  .yaku{font-size:13.5px;color:var(--sub)}

  .ctrls{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .btn{font:inherit;font-size:15px;font-weight:600;border-radius:13px;padding:15px;cursor:pointer;
    border:1px solid var(--line2);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:9px}
  .btn:active{background:var(--hover)}
  .btn.primary{border-color:var(--accent);color:var(--accent)}
  .btn.rec{border-color:var(--bad);color:var(--bad)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .hintline{font-size:12px;color:var(--faint);text-align:center;margin-top:2px}

  /* 結果 */
  .res{margin-top:22px;border:1px solid var(--line2);border-radius:16px;padding:22px 20px;display:none;flex-direction:column;gap:16px}
  .res.show{display:flex}
  .scoretop{display:flex;align-items:center;gap:20px}
  .ring{--v:0;width:88px;height:88px;flex:0 0 auto;border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--v)*1%), var(--line) 0);
    display:flex;align-items:center;justify-content:center;position:relative}
  .ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
  .ring b{position:relative;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
  .ring i{position:relative;font-style:normal;font-size:13px;font-weight:600;color:var(--sub);margin-left:1px}
  .subs{display:flex;flex-direction:column;gap:5px;font-size:13px}
  .subs .rlab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;margin-bottom:3px}
  .subs .r{display:flex;justify-content:space-between;gap:18px}
  .subs .r span:first-child{color:var(--sub)}
  .subs .r span:last-child{font-variant-numeric:tabular-nums;font-weight:600}

  .words{font-size:19px;line-height:1.9;letter-spacing:.01em}
  .w{padding:0 1px}
  .w.warn{color:var(--warn);text-decoration:underline;text-decoration-color:var(--warn);text-underline-offset:3px}
  .w.bad{color:var(--bad);text-decoration:underline;text-decoration-color:var(--bad);text-underline-offset:3px}
  .wlegend{font-size:11.5px;color:var(--faint)}
  .wlegend .warn{color:var(--warn)} .wlegend .bad{color:var(--bad)}

  .advice{font-size:14px;line-height:1.85;border-top:1px solid var(--line);padding-top:15px}
  .advice .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);font-weight:600;display:block;margin-bottom:5px}
  .heard{font-size:12px;color:var(--faint)}
  .heard b{color:var(--sub);font-weight:600}
  .badge{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

  .nav{display:flex;gap:10px;margin-top:auto;padding-top:26px}
  .nav .btn{flex:1}
  .err{font-size:13px;color:var(--bad);text-align:center;margin-top:14px;min-height:18px}
  .disc{font-size:11px;color:var(--faint);text-align:center;margin-top:26px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">話すモード</div>
    <a class="back" href="index.html">← 聞くモード</a>
  </header>
  <div class="sub">英文を聞いて、同じように声に出す練習（Part B 復唱）。</div>

  <div class="card">
    <div class="leadrow"><div class="lead" id="lead">お手本の英文</div><div class="prog" id="prog"></div></div>
    <div class="en" id="en">—</div>
    <div class="yaku" id="yaku"></div>
    <div class="ctrls">
      <button class="btn" id="listen">お手本を聞く</button>
      <button class="btn primary" id="rec">録音して採点</button>
      <div class="hintline">お手本を聞いてから、同じ文を声に出してみましょう</div>
    </div>
  </div>

  <div class="res" id="res">
    <div class="scoretop">
      <div class="ring" id="ring"><b id="pron">–</b><i>%</i></div>
      <div class="subs">
        <div class="rlab">言えた率</div>
        <div class="r"><span>言えた語</span><span id="s_said">–</span></div>
        <div class="r"><span>伝わらなかった語</span><span id="s_miss">–</span></div>
      </div>
    </div>
    <div>
      <div class="words" id="words"></div>
      <div class="wlegend">お手本の各語 ＝ <span class="bad">伝わらなかった語</span>（無色は言えている）</div>
    </div>
    <div class="advice"><span class="k">アドバイス</span><span id="advice"></span></div>
    <div class="heard" id="heard"></div>
  </div>

  <div class="err" id="err"></div>

  <div class="nav">
    <button class="btn" id="prev">前の文</button>
    <button class="btn" id="next">次の文</button>
  </div>

  <div class="disc">
    非公式の練習アプリです。言えた率は内容の一致の目安で、本番スコアではありません。<br>
    <span class="badge" id="srcbadge">モード確認中</span>
  </div>
</div>

<script>
// ===== 設定 =====
// デプロイ後、ここに Vercel のURLを入れる(例: 'https://versant-speak.vercel.app')。
// 空のままだと「モック(サンプル結果)」で動くのでUIだけ先に確認できる。
// URLに ?api=https://... を付けても上書きできる。?mock=1 で強制モック。
const API = (new URLSearchParams(location.search).get('api')) || 'https://versant-speaking-api-s8gk.vercel.app';
const FORCE_MOCK = new URLSearchParams(location.search).get('mock') === '1';

// ===== 出題(Part B)。player_data.jsonから取得、失敗時は内蔵の予備を使う =====
const FALLBACK = [
  {en:"I have to leave now.",yaku:"もう行かなきゃ。"},
  {en:"Do you want to join us?",yaku:"一緒に来る？"},
  {en:"Can you give me a hand?",yaku:"手伝ってくれる？"},
  {en:"Did you watch the film yesterday?",yaku:"昨日映画見た？"},
  {en:"Please take it to the office tomorrow morning.",yaku:"明日の朝、事務所に持って行ってね。"},
];
let ITEMS = FALLBACK, idx = 0;

async function loadItems(){
  try{
    const d = await (await fetch('player_data.json?t='+Date.now(),{cache:'no-store'})).json();
    const B = d.parts.find(p=>p.id==='B');
    const its = B.chapters.filter(c=>c.en && c.en.trim() && !c.tail).map(c=>({en:c.en.trim(),yaku:c.yaku||''}));
    if(its.length) ITEMS = its;
  }catch(e){ /* 予備を使う */ }
  render();
}

function render(){
  const it = ITEMS[idx];
  document.getElementById('en').textContent = it.en;
  document.getElementById('yaku').textContent = it.yaku;
  document.getElementById('prog').textContent = (idx+1)+' / '+ITEMS.length;
  document.getElementById('res').classList.remove('show');
  document.getElementById('err').textContent = '';
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===ITEMS.length-1;
}

// ===== お手本を聞く(端末のSpeechSynthesis。将来クリーン音源に差し替え可) =====
document.getElementById('listen').onclick = ()=>{
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ITEMS[idx].en);
    u.lang = 'en-US'; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ document.getElementById('err').textContent='お手本の再生に失敗しました'; }
};

// ===== 録音 → WAV(16kHz mono) → 採点 =====
let recorder=null, chunks=[], recording=false;
const recBtn = document.getElementById('rec');

recBtn.onclick = async ()=>{
  if(recording){ stopRec(); return; }
  document.getElementById('err').textContent='';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // マイク不可(file://等)。モックで結果表示だけ確認できる
    return scoreMock();
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    recorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      setRec(false);
      try{
        const blob = new Blob(chunks, {type: (chunks[0]&&chunks[0].type)||'audio/mp4'});
        const wavB64 = await blobToWav16k(blob);
        await sendScore(wavB64);
      }catch(e){ document.getElementById('err').textContent='音声の変換に失敗しました: '+e.message; }
    };
    recorder.start();
    setRec(true);
  }catch(e){ document.getElementById('err').textContent='マイクを使えませんでした（許可を確認してください）'; }
};
function stopRec(){ if(recorder && recorder.state!=='inactive') recorder.stop(); }
function setRec(on){
  recording=on;
  recBtn.innerHTML = on ? '<span class="dot"></span>録音中… タップで止めて採点' : '録音して採点';
  recBtn.classList.toggle('rec', on);
}

// blob(mp4/webm等) → 16kHz mono PCM16 WAV → base64
async function blobToWav16k(blob){
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const audio = await ac.decodeAudioData(buf);
  const len = audio.length, ch = audio.numberOfChannels;
  let mono = new Float32Array(len);
  for(let c=0;c<ch;c++){ const d=audio.getChannelData(c); for(let i=0;i<len;i++) mono[i]+=d[i]/ch; }
  const srcRate = audio.sampleRate, dstRate = 16000;
  const outLen = Math.max(1, Math.round(len*dstRate/srcRate));
  const out = new Float32Array(outLen);
  for(let i=0;i<outLen;i++){ const t=i*srcRate/dstRate, i0=Math.floor(t), i1=Math.min(i0+1,len-1); const f=t-i0; out[i]=mono[i0]*(1-f)+mono[i1]*f; }
  try{ ac.close(); }catch(e){}
  return b64(encodeWav(out, dstRate));
}
function encodeWav(samples, rate){
  const n=samples.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+n*2,true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,n*2,true);
  let o=44; for(let i=0;i<n;i++){ let s=Math.max(-1,Math.min(1,samples[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
  return buf;
}
function b64(arrbuf){   // 大きい配列でもスタックを溢れさせないチャンク方式
  const bytes=new Uint8Array(arrbuf); let s='';
  for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}

async function sendScore(wavB64){
  const reference = ITEMS[idx].en;
  if(!API || FORCE_MOCK) return scoreMock();
  recBtn.disabled=true; recBtn.textContent='採点中…';
  try{
    const r = await fetch(API.replace(/\/$/,'')+'/api/score', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ audio: wavB64, reference })
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'採点に失敗');
    showResult(j);
  }catch(e){ document.getElementById('err').textContent='採点サーバーに接続できませんでした: '+e.message; }
  finally{ recBtn.disabled=false; setRec(false); }
}

// キー未取得/マイク不可でもUIを確認できるサンプル(サーバー側mockと同形)
function scoreMock(){
  const ref = ITEMS[idx].en;
  const ws = ref.split(/\s+/).filter(Boolean);
  const words = ws.map((w,i)=>({word:w, ok:i%5!==2}));   // 3語目だけ抜けた想定
  const said = ws.length, ok = words.filter(w=>w.ok).length;
  showResult({
    ok:true, source:'mock', transcript:ws.filter((_,i)=>i%5!==2).join(' '),
    scores:{said:Math.round(ok/said*100)}, words, missing: words.filter(w=>!w.ok).map(w=>w.word),
    advice:'全体よく言えています。抜けやすい語をもう少しはっきり言うと、さらに伝わりやすくなります。'
  });
}

function showResult(j){
  const said = Math.round((j.scores&&j.scores.said) ?? 0);
  document.getElementById('pron').textContent = said;
  document.getElementById('ring').style.setProperty('--v', said);
  const words = j.words||[];
  const okN = words.filter(w=>w.ok).length;
  document.getElementById('s_said').textContent = `${okN} / ${words.length}`;
  document.getElementById('s_miss').textContent = (j.missing? j.missing.length : words.filter(w=>!w.ok).length);
  // お手本の各語: 言えていれば無色、伝わらなかった語は赤(塗りでなく文字色+下線)
  document.getElementById('words').innerHTML = words.map(w=>
    `<span class="w ${w.ok?'':'bad'}">${w.word}</span>`).join(' ');
  document.getElementById('advice').textContent = j.advice||'';
  const heard = j.transcript||'';
  document.getElementById('heard').innerHTML = heard ? `聞き取り: <b>${heard}</b>` : '';
  document.getElementById('srcbadge').textContent = j.source==='openai' ? 'OpenAI採点' : 'サンプル(キー未設定)';
  document.getElementById('res').classList.add('show');
  document.getElementById('res').scrollIntoView({behavior:'smooth',block:'nearest'});
}

document.getElementById('prev').onclick=()=>{ if(idx>0){idx--;render();} };
document.getElementById('next').onclick=()=>{ if(idx<ITEMS.length-1){idx++;render();} };

// 起動時: モード表示 + 出題ロード
document.getElementById('srcbadge').textContent = (!API||FORCE_MOCK) ? 'サンプル(キー未設定)' : '採点サーバー接続';
loadItems();
</script>
</body>
</html>
